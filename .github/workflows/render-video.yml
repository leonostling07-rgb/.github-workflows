name: render-video

on:
  workflow_dispatch:
    inputs:
      script:     { description: "Voiceover text", required: false, type: string, default: "" }
      scenes:     { description: "Scenes JSON array", required: false, type: string, default: "[]" }
      title:      { description: "Video title", required: false, type: string, default: "AI Short" }
      theme:      { description: "Theme JSON", required: false, type: string, default: "{}" }
      demo:       { description: "Render the submarine demo instead of AI props", required: false, type: boolean, default: false }

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: System libs for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg

      - name: Demo mode — skip AI, use demo props
        if: ${{ inputs.demo }}
        run: |
          cp demo-props.json props.json
          echo "DEMO MODE"

      - name: Install python tools
        if: ${{ !inputs.demo }}
        run: pip install faster-whisper edge-tts

      - name: Make voiceover (free, edge-tts)
        if: ${{ !inputs.demo }}
        env:
          SCRIPT_TEXT: ${{ inputs.script }}
        run: |
          printf '%s' "$SCRIPT_TEXT" > script.txt
          edge-tts --voice en-US-AndrewNeural --file script.txt --write-media voice.mp3
          ffmpeg -y -i voice.mp3 -ar 24000 -ac 1 voice.wav

      - name: Prepare props (whisper word timings + scene timing)
        if: ${{ !inputs.demo }}
        env:
          IN_SCRIPT: ${{ inputs.script }}
          IN_SCENES: ${{ inputs.scenes }}
          IN_TITLE: ${{ inputs.title }}
          IN_THEME: ${{ inputs.theme }}
          IN_AUDIO: voice.wav
        run: python scripts/prepare.py

      - name: Install Remotion
        run: npm install --no-audit --no-fund

      - name: Render
        run: npx remotion render src/index.ts Short out/latest.mp4 --props=props.json --codec=h264 --concurrency=2

      - name: Commit result
        run: |
          mkdir -p videos
          cp out/latest.mp4 videos/latest.mp4
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add videos/latest.mp4
          git commit -m "Render video" || echo "nothing to commit"
          git pull --rebase || true
          git push
