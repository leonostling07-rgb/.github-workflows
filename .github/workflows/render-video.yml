                    b.object ||
                    b.prop ||
                    b.target ||
                    ""
                  ).toLowerCase() ===
                  id.toLowerCase()
              );

            const b =
              own[own.length - 1] ||
              null;

            const a = norm(
              b?.action ||
              "idle"
            );

            const p = b
              ? clamp(
                  (
                    localSeconds -
                    Number(
                      b.start || 0
                    )
                  ) /
                    Math.max(
                      0.08,
                      Number(
