                        b.start ||
                        1
                      ) -
                        Number(
                          b.start ||
                          0
                        )
                    )
                )
              : 0;

            let tx = 0;
            let ty =
              Math.sin(
                localSeconds *
                  2 +
                  hash(id)
              ) *
              1.4;

            let rot = 0;
            let sc = s;

            if (
              a.includes("shake") ||
              a.includes("vibrate")
            ) {
              tx =
