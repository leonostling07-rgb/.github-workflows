                    ),
                  filter:
                    "drop-shadow(0 15px 12px rgba(10,18,30,.18))"
                }}
              >

                <svg
                  width="260"
                  height="220"
                  viewBox="0 0 220 220"
                >
                  {graphic}
                </svg>

              </div>
