name: Render Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string
      script:
        description: "Voice-over script"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Download video
        run: |
          curl -L "${{ inputs.video_url }}" -o input.mp4

      - name: Generate voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "${{ inputs.script }}" '{
              contents: [{
                parts: [{
                  text: $text
                }]
              }],
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: "Kore"
                    }
                  }
                }
              }
            }')" > response.json

          echo "Gemini response:"
          cat response.json

          AUDIO=$(jq -r '.candidates[0].content.parts[0].inlineData.data // empty' response.json)

          if [ -z "$AUDIO" ]; then
            echo "ERROR: No audio returned from Gemini"
            exit 1
          fi

          echo "$AUDIO" | base64 -d > voice.pcm

          echo "Audio file size:"
          ls -lh voice.pcm

          echo "Audio file bytes:"
          wc -c voice.pcm

      - name: Render video
        run: |
          ffmpeg -y \
            -i input.mp4 \
            -f s16le \
            -ar 24000 \
            -ac 1 \
            -i voice.pcm \
            -map 0:v:0 \
            -map 1:a:0 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            output.mp4

      - name: Save video to repository
        run: |
          mkdir -p videos
          cp output.mp4 videos/latest.mp4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/latest.mp4
          git commit -m "Update rendered video" || echo "No changes to commit"
          git push
