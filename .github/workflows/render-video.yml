name: Render AI Cartoon Video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Full voice-over script"
        required: true
        type: string
      scenes:
        description: "JSON storyboard from n8n"
        required: true
        type: string
      title:
        description: "Video title"
        required: true
        type: string
      theme:
        description: "Theme JSON"
        required: false
        default: "{}"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create self-contained Remotion project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ai-video
          mkdir -p ai-video/src ai-video/public ai-video/out

          cat > ai-video/package.json <<'EOF'
          {
            "private": true,
            "scripts": {
              "render": "remotion render src/index.jsx Main out/video.mp4 --props=props.json"
            },
            "dependencies": {
              "@remotion/cli": "4.0.529",
              "remotion": "4.0.529",
              "react": "18.3.1",
              "react-dom": "18.3.1"
            }
          }
          EOF

          cat > ai-video/src/index.jsx <<'EOF'
          import React from "react";
          import { registerRoot, Composition } from "remotion";
          import { Video } from "./Video";

          const FPS = 30;

          function getDurationInFrames(props) {
            const scenes = Array.isArray(props?.scenes) ? props.scenes : [];
            const seconds = scenes.reduce(
              (sum, scene) => sum + Number(scene.duration || 5),
              0
            );
            return Math.max(1, Math.round(seconds * FPS));
          }

          function Root() {
            return (
              <Composition
                id="Main"
                component={Video}
                durationInFrames={180}
                fps={FPS}
                width={1080}
                height={1920}
                defaultProps={{ scenes: [], captions: [], title: "", theme: {} }}
                calculateMetadata={({ props }) => ({
                  durationInFrames: getDurationInFrames(props),
                  fps: FPS,
                  width: 1080,
                  height: 1920,
                })}
              />
            );
          }

          registerRoot(Root);
          EOF

          cat > ai-video/src/Video.jsx <<'EOF'
          import React from "react";
          import {
            AbsoluteFill,
            Audio,
            interpolate,
            staticFile,
            useCurrentFrame,
          } from "remotion";

          const W = 1080;
          const H = 1920;
          const FPS = 30;

          const C = {
            ink: "#172033",
            skin: "#F2B38D",
            hair: "#2A1C20",
            white: "#FFFFFF",
            navy: "#27324A",
            blue: "#4E6BE8",
            blue2: "#79B6E8",
            green: "#65A77D",
            yellow: "#FFD35A",
            orange: "#E97A5F",
            red: "#D85E5E",
            purple: "#8C72D8",
            paper: "#F8F4EA",
            grey: "#8B95A5",
          };

          const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
          const lerp = (a, b, t) => a + (b - a) * t;
          const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

          function hash(s = "") {
            let h = 2166136261;
            for (let i = 0; i < s.length; i++) {
              h ^= s.charCodeAt(i);
              h = Math.imul(h, 16777619);
            }
            return Math.abs(h);
          }

          function actionProgress(frame, beat) {
            const start = Number(beat.start ?? beat.time ?? 0) * FPS;
            const end = Number(beat.end ?? ((beat.time ?? 0) + 1)) * FPS;
            return clamp((frame - start) / Math.max(1, end - start));
          }

          function motionFor(action, p, seed) {
            const a = String(action || "").toLowerCase();
            const s = (seed % 1000) / 1000;
            const t = ease(p);

            if (a === "walk" || a === "run" || a === "enter" || a === "exit") {
              return { x: lerp(-90, 90, t), y: Math.sin(p * Math.PI * 4 + s * 5) * 6, r: Math.sin(p * Math.PI * 4) * 2, scale: 1 };
            }
            if (a === "reach" || a === "pick_up" || a === "put_down") {
              return { x: Math.sin(p * Math.PI) * 18, y: -Math.sin(p * Math.PI) * 22, r: 0, scale: 1 };
            }
            if (a === "open" || a === "close") {
              return { x: 0, y: 0, r: lerp(-8, 0, t), scale: 1 };
            }
            if (a === "look" || a === "talk" || a === "think" || a === "read") {
              return { x: Math.sin(p * Math.PI * 2 + s * 3) * 7, y: 0, r: Math.sin(p * Math.PI * 2) * 1.2, scale: 1 };
            }
            if (a === "type") {
              return { x: Math.sin(p * Math.PI * 12) * 2, y: Math.sin(p * Math.PI * 8) * 2, r: 0, scale: 1 };
            }
            if (a === "discover" || a === "reveal") {
              return { x: 0, y: -Math.sin(p * Math.PI) * 18, r: 0, scale: lerp(0.84, 1.05, t) };
            }
            if (a === "shake" || a === "react") {
              return { x: Math.sin(p * Math.PI * 14) * 8, y: Math.cos(p * Math.PI * 12) * 4, r: Math.sin(p * Math.PI * 12) * 2, scale: 1 };
            }
            if (a === "fall") {
              return { x: 0, y: lerp(-80, 90, t), r: lerp(0, 18, t), scale: 1 };
            }
            if (a === "rise") {
              return { x: 0, y: lerp(80, -80, t), r: lerp(4, 0, t), scale: 1 };
            }
            if (a === "fly") {
              return { x: lerp(-100, 100, t), y: -Math.sin(p * Math.PI) * 110, r: lerp(-8, 10, t), scale: 1 };
            }
            if (a === "grow") {
              return { x: 0, y: 0, r: 0, scale: lerp(0.5, 1.25, t) };
            }
            if (a === "shrink") {
              return { x: 0, y: 0, r: 0, scale: lerp(1.2, 0.55, t) };
            }
            if (a === "collide") {
              return { x: Math.sin(p * Math.PI) * 24, y: -Math.sin(p * Math.PI) * 12, r: Math.sin(p * Math.PI * 8) * 4, scale: 1 };
            }
            if (a === "turn") {
              return { x: 0, y: 0, r: lerp(-18, 0, t), scale: 1 };
            }
            if (a === "celebrate") {
              return { x: Math.sin(p * Math.PI * 4) * 8, y: -Math.abs(Math.sin(p * Math.PI * 2)) * 35, r: Math.sin(p * Math.PI * 3) * 4, scale: 1.04 };
            }
            return { x: 0, y: 0, r: 0, scale: 1 };
          }

          function activeMotion(id, beats, frame, sceneDuration) {
            let result = { x: 0, y: 0, r: 0, scale: 1, action: "" };
            for (const beat of beats || []) {
              const targetCharacter = beat.character ?? beat.subject;
              if (targetCharacter !== id && beat.object !== id) continue;
              const p = actionProgress(frame, beat);
              const start = Number(beat.start ?? beat.time ?? 0) * FPS;
              const end = Number(beat.end ?? ((beat.time ?? 0) + 1)) * FPS;
              if (frame >= start && frame <= end) {
                result = { ...motionFor(beat.action, p, hash(id)), action: beat.action };
              }
            }
            return result;
          }

          function SvgIcon({ type, accent = C.blue }) {
            const t = String(type || "").toLowerCase();

            if (t.includes("phone")) return <g>
              <rect x="35" y="8" width="110" height="205" rx="20" fill="#1E2736" />
              <rect x="46" y="25" width="88" height="158" rx="11" fill="#8DC7E9" />
              <circle cx="90" cy="196" r="7" fill="#DDE4EC" />
              <circle cx="112" cy="55" r="7" fill="#FFFFFF" opacity=".7" />
            </g>;

            if (t.includes("laptop") || t.includes("computer")) return <g>
              <rect x="18" y="22" width="145" height="100" rx="10" fill="#344254" />
              <rect x="29" y="33" width="123" height="77" rx="5" fill="#B4DFF2" />
              <path d="M0 128 L181 128 L162 150 L19 150Z" fill="#727F90" />
              <line x1="48" y1="60" x2="110" y2="60" stroke={accent} strokeWidth="7" strokeLinecap="round" />
              <line x1="48" y1="82" x2="92" y2="82" stroke="#FFFFFF" strokeWidth="6" strokeLinecap="round" opacity=".75" />
            </g>;

            if (t.includes("clock")) return <g>
              <circle cx="92" cy="92" r="75" fill="#FFF9EA" stroke="#394657" strokeWidth="9" />
              {Array.from({length: 12}).map((_, i) => {
                const a = i * Math.PI / 6;
                return <circle key={i} cx={92 + Math.sin(a)*59} cy={92 - Math.cos(a)*59} r="3.5" fill="#647082" />;
              })}
              <line x1="92" y1="92" x2="92" y2="45" stroke="#394657" strokeWidth="8" strokeLinecap="round" />
              <line x1="92" y1="92" x2="127" y2="108" stroke="#394657" strokeWidth="8" strokeLinecap="round" />
            </g>;

            if (t.includes("coffee") || t.includes("cup")) return <g>
              <path d="M35 48 L137 48 L126 145 Q85 168 46 145Z" fill="#F5F0E8" stroke="#465365" strokeWidth="8" />
              <path d="M137 72 Q188 63 165 119 Q153 138 127 128" fill="none" stroke="#465365" strokeWidth="9" />
              <path d="M60 28 Q49 5 66 0 M92 28 Q81 5 98 0" stroke="#FFFFFF" strokeWidth="8" strokeLinecap="round" opacity=".8" />
            </g>;

            if (t.includes("book")) return <g>
              <path d="M12 36 Q55 14 91 35 L91 155 Q52 134 12 153Z" fill="#F0E0BD" stroke="#6A5A4B" strokeWidth="7" />
              <path d="M91 35 Q128 14 170 36 L170 153 Q130 134 91 155Z" fill="#FFF4D9" stroke="#6A5A4B" strokeWidth="7" />
              {[0,1,2].map(i => <line key={i} x1="30" y1={68+i*24} x2="72" y2={63+i*24} stroke="#A18D70" strokeWidth="5" />)}
              {[0,1,2].map(i => <line key={i} x1="108" y1={63+i*24} x2="151" y2={68+i*24} stroke="#A18D70" strokeWidth="5" />)}
            </g>;

            if (t.includes("chart") || t.includes("graph")) return <g>
              <rect x="8" y="12" width="175" height="150" rx="14" fill="#FBFAF5" stroke="#7D8796" strokeWidth="6" />
              <polyline points="28,132 62,108 91,118 125,66 160,38" fill="none" stroke={accent} strokeWidth="11" strokeLinecap="round" strokeLinejoin="round" />
              <circle cx="62" cy="108" r="7" fill={accent} />
              <circle cx="125" cy="66" r="7" fill={accent} />
            </g>;

            if (t.includes("money") || t.includes("cash")) return <g>
              <rect x="15" y="48" width="165" height="98" rx="16" fill="#78B884" stroke="#386C45" strokeWidth="7" />
              <circle cx="98" cy="97" r="30" fill="#C8E4A6" stroke="#386C45" strokeWidth="5" />
              <text x="98" y="112" textAnchor="middle" fontSize="44" fontWeight="800" fill="#386C45">$</text>
            </g>;

            if (t.includes("key")) return <g>
              <circle cx="60" cy="82" r="34" fill="none" stroke="#E2B94F" strokeWidth="16" />
              <path d="M88 105 L165 168 M125 137 L143 119 M144 154 L162 136" stroke="#E2B94F" strokeWidth="16" strokeLinecap="round" />
            </g>;

            if (t.includes("lock")) return <g>
              <rect x="35" y="75" width="120" height="105" rx="16" fill="#F0C75E" stroke="#8B6C2C" strokeWidth="7" />
              <path d="M60 80 V52 Q60 18 95 18 Q130 18 130 52 V80" fill="none" stroke="#8B6C2C" strokeWidth="15" />
              <circle cx="95" cy="123" r="11" fill="#8B6C2C" />
            </g>;

            if (t.includes("lightbulb") || t.includes("idea")) return <g>
              <path d="M92 18 Q40 18 40 72 Q40 103 66 123 L66 146 L118 146 L118 123 Q144 103 144 72 Q144 18 92 18Z" fill="#FFD45A" stroke="#A2761F" strokeWidth="7" />
              <path d="M72 164 L112 164" stroke="#5B6574" strokeWidth="11" strokeLinecap="round" />
              <path d="M76 182 L108 182" stroke="#5B6574" strokeWidth="9" strokeLinecap="round" />
            </g>;

            if (t.includes("rocket")) return <g>
              <path d="M95 10 Q155 42 126 132 L95 166 L64 132 Q35 42 95 10Z" fill="#F4F6F8" stroke="#495568" strokeWidth="7" />
              <circle cx="95" cy="77" r="20" fill="#83C5EA" stroke="#495568" strokeWidth="6" />
              <path d="M64 117 L25 145 L59 145 M126 117 L165 145 L131 145" fill="#E97861" stroke="#9B4A3D" strokeWidth="5" />
              <path d="M79 160 L95 202 L111 160" fill="#FFD15B" />
            </g>;

            if (t.includes("moon")) return <g>
              <path d="M132 22 Q78 28 74 88 Q72 142 127 160 Q86 176 50 150 Q13 124 20 76 Q28 22 82 13 Q111 9 132 22Z" fill="#F4E9B8" stroke="#8D7F59" strokeWidth="6" />
              <circle cx="71" cy="72" r="11" fill="#D4C994" /><circle cx="102" cy="112" r="8" fill="#D4C994" />
            </g>;

            if (t.includes("planet") || t.includes("globe")) return <g>
              <circle cx="94" cy="94" r="76" fill="#6EA7E8" stroke="#385D89" strokeWidth="7" />
              <path d="M38 83 Q72 60 96 76 T150 69 M46 115 Q83 95 118 120 T150 115" fill="none" stroke="#72B77D" strokeWidth="18" strokeLinecap="round" />
            </g>;

            if (t.includes("tree")) return <g>
              <rect x="82" y="102" width="26" height="92" rx="10" fill="#79543D" />
              <circle cx="95" cy="80" r="70" fill="#70AA70" />
              <circle cx="51" cy="98" r="45" fill="#82B97B" />
              <circle cx="141" cy="99" r="48" fill="#5D9D64" />
            </g>;

            if (t.includes("car")) return <g>
              <path d="M28 104 L51 57 L143 57 L166 104 L178 139 L16 139Z" fill="#DF6A63" stroke="#753D3A" strokeWidth="7" />
              <rect x="62" y="71" width="66" height="32" rx="8" fill="#A8D4EA" />
              <circle cx="52" cy="143" r="21" fill="#263243" /><circle cx="144" cy="143" r="21" fill="#263243" />
            </g>;

            if (t.includes("trophy")) return <g>
              <path d="M54 36 L136 36 L126 108 Q95 130 64 108Z" fill="#FFD35A" stroke="#9A7620" strokeWidth="7" />
              <path d="M55 55 Q14 45 26 91 Q35 112 65 99 M135 55 Q176 45 164 91 Q155 112 125 99" fill="none" stroke="#9A7620" strokeWidth="9" />
              <rect x="87" y="111" width="16" height="39" fill="#9A7620" /><rect x="54" y="149" width="82" height="17" rx="8" fill="#9A7620" />
            </g>;

            if (t.includes("heart")) return <path d="M95 165 L24 88 Q4 52 36 28 Q67 7 95 45 Q123 7 154 28 Q186 52 166 88Z" fill="#E96B73" stroke="#9F3F49" strokeWidth="7" />;

            if (t.includes("brain")) return <g>
              <path d="M78 26 Q41 9 30 53 Q6 75 30 105 Q15 141 54 151 Q71 177 95 151 Q124 174 139 142 Q173 136 151 105 Q175 73 146 52 Q141 14 108 29 Q94 7 78 26Z" fill="#DCA6E9" stroke="#563D68" strokeWidth="7" />
              <path d="M76 49 Q57 69 76 88 Q53 105 71 127 M108 46 Q91 67 111 84 Q91 103 109 126" fill="none" stroke="#8D5B9B" strokeWidth="7" strokeLinecap="round" />
            </g>;

            if (t.includes("mountain")) return <g>
              <path d="M12 166 L72 62 L103 105 L134 38 L181 166Z" fill="#7F9AB1" stroke="#4B6073" strokeWidth="7" />
              <path d="M53 95 L72 62 L91 89 L78 86Z M117 72 L134 38 L151 75 L138 68Z" fill="#F4F1E8" />
            </g>;

            if (t.includes("whale")) return <g>
              <path d="M18 108 Q57 42 124 73 Q152 86 173 66 Q168 124 116 137 Q58 151 18 108Z" fill="#5F8FB3" stroke="#38586F" strokeWidth="7" />
              <path d="M60 77 Q83 65 101 78" fill="none" stroke="#D8EDF7" strokeWidth="6" />
              <circle cx="135" cy="92" r="6" fill="#1C2837" />
              <path d="M92 70 Q100 38 112 24" stroke="#78B7D2" strokeWidth="7" fill="none" strokeLinecap="round" />
            </g>;

            return <g>
              <rect x="18" y="25" width="155" height="125" rx="24" fill="#FFFFFF" stroke="#738092" strokeWidth="7" />
              <circle cx="67" cy="83" r="9" fill={accent} />
              <circle cx="123" cy="83" r="9" fill={accent} />
              <path d="M62 112 Q95 135 128 112" fill="none" stroke="#738092" strokeWidth="6" strokeLinecap="round" />
            </g>;
          }

          function Character({ character, beats, frame, index }) {
            const id = character.id;
            const m = activeMotion(id, beats, frame);
            const seed = hash(id);
            const blink = (Math.floor(frame / 4) + seed) % 145 === 0;
            const x = Number(character.x ?? 50);
            const y = Number(character.y ?? 78);
            const skin = character.skin || C.skin;
            const hair = character.hairColor || character.hair || C.hair;
            const shirt = character.clothesColor || character.color || C.blue;
            const lookLeft = m.action === "look" || m.action === "search";
            const eyeY = blink ? 107 : 102;
            const mouth = m.action === "react" || m.action === "discover" ? "M78 143 Q96 132 114 143" : "M78 141 Q96 151 114 141";

            return (
              <div style={{
                position: "absolute",
                left: `${x}%`,
                top: `${y}%`,
                width: 260,
                height: 500,
                transform: `translate(-50%,-100%) translate(${m.x}px,${m.y}px) rotate(${m.r}deg) scale(${m.scale})`,
                transformOrigin: "50% 100%",
                zIndex: 20,
                filter: "drop-shadow(0 20px 14px rgba(20,30,50,.16))"
              }}>
                <svg width="260" height="500" viewBox="0 0 260 500">
                  <g>
                    <ellipse cx="130" cy="462" rx="84" ry="22" fill="#1D293A" opacity=".13" />
                    <path d="M67 197 Q130 165 193 197 L207 348 Q130 379 53 348Z" fill={shirt} />
                    <path d="M70 216 Q27 252 38 326" fill="none" stroke={skin} strokeWidth="31" strokeLinecap="round" />
                    <path d="M190 216 Q233 252 222 326" fill="none" stroke={skin} strokeWidth="31" strokeLinecap="round" />
                    <path d="M89 345 L78 454" stroke="#26334B" strokeWidth="40" strokeLinecap="round" />
                    <path d="M171 345 L182 454" stroke="#26334B" strokeWidth="40" strokeLinecap="round" />
                    <path d="M52 460 L96 460" stroke="#182235" strokeWidth="26" strokeLinecap="round" />
                    <path d="M164 460 L208 460" stroke="#182235" strokeWidth="26" strokeLinecap="round" />

                    <g transform={`rotate(${Math.sin(frame/FPS*1.7+index)*1.5} 130 110)`}>
                      <circle cx="130" cy="108" r="88" fill={skin} />
                      <path d="M42 97 Q49 20 128 20 Q205 20 218 96 Q185 67 146 69 Q95 69 42 97Z" fill={hair} />
                      <path d="M82 102 Q90 96 98 102" stroke={C.ink} strokeWidth="7" strokeLinecap="round" />
                      <path d="M162 102 Q170 96 178 102" stroke={C.ink} strokeWidth="7" strokeLinecap="round" />
                      <ellipse cx={lookLeft ? 91 : 90} cy={eyeY} rx="7" ry={blink ? 2 : 10} fill={C.ink} />
                      <ellipse cx={lookLeft ? 171 : 170} cy={eyeY} rx="7" ry={blink ? 2 : 10} fill={C.ink} />
                      <path d="M101 143 Q130 157 159 143" fill="none" stroke={C.ink} strokeWidth="7" strokeLinecap="round" />
                      <path d={mouth} fill="none" stroke={C.ink} strokeWidth="7" strokeLinecap="round" opacity={m.action === "discover" ? .9 : .35} />
                      <circle cx="76" cy="136" r="12" fill="#E98C87" opacity=".28" />
                      <circle cx="184" cy="136" r="12" fill="#E98C87" opacity=".28" />
                    </g>

                    {(m.action === "point" || m.action === "discover") && (
                      <path d="M191 233 Q235 215 247 175" fill="none" stroke={skin} strokeWidth="28" strokeLinecap="round" />
                    )}
                  </g>
                </svg>
              </div>
            );
          }

          function Object({ object, beats, frame, index }) {
            const m = activeMotion(object.id, beats, frame);
            const seed = hash(object.id);
            const idle = Math.sin(frame/FPS*1.4 + seed) * 2.5;
            const x = Number(object.x ?? 50);
            const y = Number(object.y ?? 50);
            const scale = Number(object.scale ?? 1);

            return (
              <div style={{
                position: "absolute",
                left: `${x}%`,
                top: `${y}%`,
                width: 220,
                height: 220,
                transform: `translate(-50%,-50%) translate(${m.x}px,${m.y + idle}px) rotate(${m.r}deg) scale(${scale*m.scale})`,
                transformOrigin: "50% 50%",
                zIndex: 12 + index,
                filter: "drop-shadow(0 15px 12px rgba(20,30,50,.13))"
              }}>
                <svg width="220" height="220" viewBox="0 0 190 210">
                  <SvgIcon type={object.type} />
                </svg>
              </div>
            );
          }

          function Environment({ setting, environment, sceneIndex, theme }) {
            const env = environment || {};
            const s = String([setting || "", env.type || "", env.architecture || "", env.materials || ""].join(" ")).toLowerCase();
            const bg = theme?.background || "#EAF0F7";
            const accent = theme?.accent || C.blue;
            const night = s.includes("space") || s.includes("night");

            const isCity = s.includes("city") || s.includes("street");
            const isOffice = s.includes("office");
            const isLab = s.includes("laboratory") || s.includes("lab");
            const isClass = s.includes("classroom") || s.includes("school");
            const isKitchen = s.includes("kitchen") || s.includes("restaurant");
            const isForest = s.includes("forest") || s.includes("mountain");
            const isOcean = s.includes("ocean") || s.includes("beach");
            const isGym = s.includes("gym");
            const isTunnel = s.includes("tunnel") || s.includes("subway") || s.includes("metro");

            return (
              <AbsoluteFill style={{ background: bg, overflow: "hidden" }}>
                <svg width="100%" height="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
                  <defs>
                    <linearGradient id={`g${sceneIndex}`} x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor={night ? "#18213A" : "#DDEBF6"} />
                      <stop offset="100%" stopColor={night ? "#2C3858" : "#F6F1E8"} />
                    </linearGradient>
                    <filter id={`shadow${sceneIndex}`} x="-30%" y="-30%" width="160%" height="160%">
                      <feDropShadow dx="0" dy="12" stdDeviation="16" floodOpacity=".13" />
                    </filter>
                  </defs>

                  <rect width={W} height={H} fill={`url(#g${sceneIndex})`} />

                  {isTunnel ? (
                    <>
                      <path d="M70 1190 Q540 380 1010 1190 L1010 1920 L70 1920Z" fill="#202733" />
                      <path d="M165 1190 Q540 520 915 1190 L915 1920 L165 1920Z" fill="#111720" />
                      <path d="M270 1190 Q540 700 810 1190 L810 1920 L270 1920Z" fill="#18202B" />
                      {Array.from({length: 8}).map((_, i) => {
                        const y = 720 + i * 135;
                        return <g key={i}>
                          <rect x={300 - i * 13} y={y} width={480 + i * 26} height="24" rx="12" fill="#A9D8E8" opacity={0.16 + 0.05 * i} />
                          <rect x={330 - i * 9} y={y + 8} width={420 + i * 18} height="8" fill="#F8D776" opacity={0.75 - 0.04 * i} />
