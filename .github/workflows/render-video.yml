name: Render Video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Voice-over script"
        required: true
        type: string
      scenes:
        description: "Video scenes JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Generate voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sS \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-tts:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "${{ inputs.script }}" '{
              contents: [{
                role: "user",
                parts: [{
                  text: $text
                }]
              }],
              generationConfig: {
                responseModalities: ["AUDIO"],
                responseFormat: {
                  audio: {
                    mimeType: "AUDIO_L16",
                    sampleRate: 24000
                  }
                },
                speechConfig: {
                  voiceConfig: {
                    voice: "Kore"
                  }
                }
              }
            }')" > response.json

          AUDIO=$(jq -r '.candidates[0].content.parts[0].inlineData.data // empty' response.json)

          if [ -z "$AUDIO" ]; then
            echo "ERROR: No audio returned from Gemini"
            cat response.json
            exit 1
          fi

          echo "$AUDIO" | base64 -d > voice.pcm

      - name: Parse scenes
        run: |
          echo '${{ inputs.scenes }}' > scenes.json
          cat scenes.json

      - name: Download scene videos
        run: |
          mkdir -p scenes

          jq -c '.[]' scenes.json | while read scene; do
            NUMBER=$(echo "$scene" | jq -r '.scene')
            URL=$(echo "$scene" | jq -r '.video_url')
            DURATION=$(echo "$scene" | jq -r '.duration')

            echo "Downloading scene $NUMBER"
            curl -L "$URL" -o "scenes/scene_${NUMBER}.mp4"

            echo "Preparing scene $NUMBER for ${DURATION} seconds"

            ffmpeg -y \
              -stream_loop -1 \
              -i "scenes/scene_${NUMBER}.mp4" \
              -t "$DURATION" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              "scenes/scene_${NUMBER}_prepared.mp4"
          done

      - name: Create concat list
        run: |
          rm -f concat.txt

          jq -r '.[].scene' scenes.json | while read NUMBER; do
            echo "file 'scenes/scene_${NUMBER}_prepared.mp4'" >> concat.txt
          done

          cat concat.txt

      - name: Combine scenes
        run: |
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            combined.mp4

      - name: Add voice-over
        run: |
          ffmpeg -y \
            -i combined.mp4 \
            -f s16le \
            -ar 24000 \
            -ac 1 \
            -i voice.pcm \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            output.mp4

      - name: Save video to repository
        run: |
          mkdir -p videos
          cp output.mp4 videos/latest.mp4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/latest.mp4
          git commit -m "Update rendered video" || echo "No changes to commit"
          git push
