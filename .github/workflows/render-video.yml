name: Render Video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Voice-over script"
        required: true
        type: string

      scenes:
        description: "Video scenes JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      # ==================================================
      # GENERATE GEMINI VOICE
      # ==================================================

      - name: Generate voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRIPT_TEXT: ${{ inputs.script }}
        run: |

          echo "Generating voice with Gemini 3.8 Flash-Lite TTS..."

          curl -sS \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-lite-tts:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg text "$SCRIPT_TEXT" \
              '{
                contents: [{
                  role: "user",
                  parts: [{
                    text: $text
                  }]
                }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  responseFormat: {
                    audio: {
                      mimeType: "AUDIO_L16",
                      sampleRate: 24000
                    }
                  },
                  speechConfig: {
                    voiceConfig: {
                      voice: "Kore"
                    }
                  }
                }
              }')" > response.json

          echo "Gemini response:"
          cat response.json

          AUDIO=$(jq -r \
            '.candidates[0].content.parts[0].inlineData.data // empty' \
            response.json)

          if [ -z "$AUDIO" ]; then
            echo "ERROR: Gemini returned no audio."

            ERROR_MESSAGE=$(jq -r \
              '.error.message // "Unknown Gemini error"' \
              response.json)

            echo "Gemini error:"
            echo "$ERROR_MESSAGE"

            exit 1
          fi

          echo "$AUDIO" | base64 -d > voice.pcm

          VOICE_BYTES=$(wc -c < voice.pcm)

          VOICE_DURATION=$(awk \
            -v bytes="$VOICE_BYTES" \
            'BEGIN { printf "%.3f", bytes / (24000 * 2) }')

          echo "Voice duration: ${VOICE_DURATION} seconds"

          if awk "BEGIN {exit !($VOICE_DURATION < 5)}"; then
            echo "ERROR: Voice is unexpectedly short."
            exit 1
          fi

          if awk "BEGIN {exit !($VOICE_DURATION > 60)}"; then
            echo "ERROR: Voice is unexpectedly long."
            exit 1
          fi

      # ==================================================
      # PARSE SCENES
      # ==================================================

      - name: Parse scenes
        env:
          SCENES_JSON: ${{ inputs.scenes }}
        run: |

          printf '%s' "$SCENES_JSON" > scenes.json

          echo "Received scenes JSON:"
          cat scenes.json

          echo
          echo "Validating JSON..."

          jq empty scenes.json

          SCENE_COUNT=$(jq 'length' scenes.json)

          echo "Scene count: $SCENE_COUNT"

          if [ "$SCENE_COUNT" -lt 5 ]; then
            echo "ERROR: Expected at least 5 scenes."
            exit 1
          fi

      # ==================================================
      # MATCH SCENE DURATIONS TO VOICE
      # ==================================================

      - name: Match scene durations to voice
        run: |

          VOICE_BYTES=$(wc -c < voice.pcm)

          VOICE_DURATION=$(awk \
            -v bytes="$VOICE_BYTES" \
            'BEGIN { printf "%.6f", bytes / (24000 * 2) }')

          ORIGINAL_TOTAL=$(jq \
            '[.[].duration] | add' \
            scenes.json)

          echo "Original scene duration total: $ORIGINAL_TOTAL"
          echo "Voice duration: $VOICE_DURATION"

          if awk "BEGIN {exit !($ORIGINAL_TOTAL <= 0)}"; then
            echo "ERROR: Invalid total scene duration."
            exit 1
          fi

          SCALE=$(awk \
            -v voice="$VOICE_DURATION" \
            -v total="$ORIGINAL_TOTAL" \
            'BEGIN { printf "%.8f", voice / total }')

          echo "Duration scale factor: $SCALE"

          jq \
            --argjson scale "$SCALE" \
            'map(
              .duration =
                ((.duration * $scale * 1000 | round) / 1000)
            )' \
            scenes.json > scaled_scenes.json

          mv scaled_scenes.json scenes.json

          echo
          echo "Adjusted scenes:"
          jq '.' scenes.json

          FINAL_TOTAL=$(jq \
            '[.[].duration] | add' \
            scenes.json)

          echo
          echo "Adjusted total duration: $FINAL_TOTAL seconds"

      # ==================================================
      # DOWNLOAD AND PREPARE SCENES
      # ==================================================

      - name: Download and prepare scene videos
        run: |

          mkdir -p scenes

          jq -c '.[]' scenes.json > scene_list.txt

          while IFS= read -r SCENE_JSON; do

            NUMBER=$(echo "$SCENE_JSON" | jq -r '.scene')
            URL=$(echo "$SCENE_JSON" | jq -r '.video_url')
            DURATION=$(echo "$SCENE_JSON" | jq -r '.duration')

            echo
            echo "========================================"
            echo "SCENE $NUMBER"
            echo "URL: $URL"
            echo "DURATION: $DURATION seconds"
            echo "========================================"

            # Remove accidental Markdown formatting if present.
            if [[ "$URL" =~ ^\[.*\]\(.*\)$ ]]; then
              URL=$(echo "$URL" | sed -E 's/^\[([^]]+)\]\(([^)]+)\)$/\2/')
            fi

            curl \
              --location \
              --fail \
              --retry 3 \
              --retry-all-errors \
              "$URL" \
              -o "scenes/scene_${NUMBER}.mp4"

            echo "Downloaded scene $NUMBER"

            ffmpeg \
              -nostdin \
              -y \
              -stream_loop -1 \
              -i "scenes/scene_${NUMBER}.mp4" \
              -t "$DURATION" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -r 30 \
              -video_track_timescale 90000 \
              "scenes/scene_${NUMBER}_prepared.mp4"

            echo "Prepared scene $NUMBER"

          done < scene_list.txt

      # ==================================================
      # VERIFY ALL SCENES
      # ==================================================

      - name: Verify prepared scenes
        run: |

          EXPECTED=$(jq 'length' scenes.json)

          ACTUAL=$(find scenes \
            -name '*_prepared.mp4' \
            -type f | wc -l)

          echo "Expected scenes: $EXPECTED"
          echo "Prepared scenes: $ACTUAL"

          if [ "$EXPECTED" -ne "$ACTUAL" ]; then
            echo "ERROR: Not all scenes were prepared."
            exit 1
          fi

          for NUMBER in $(jq -r '.[].scene' scenes.json); do

            FILE="scenes/scene_${NUMBER}_prepared.mp4"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing $FILE"
              exit 1
            fi

            DURATION=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FILE")

            echo "Scene $NUMBER duration: $DURATION seconds"

          done

      # ==================================================
      # COMBINE ALL SCENES
      # ==================================================

      - name: Combine scenes
        run: |

          INPUT_ARGS=()
          FILTER=""
          INDEX=0
          COUNT=0

          while IFS= read -r NUMBER; do

            INPUT_ARGS+=(
              -i
              "scenes/scene_${NUMBER}_prepared.mp4"
            )

            FILTER="${FILTER}[${INDEX}:v]"

            INDEX=$((INDEX + 1))
            COUNT=$((COUNT + 1))

          done < <(jq -r '.[].scene' scenes.json)

          FILTER="${FILTER}concat=n=${COUNT}:v=1:a=0[v]"

          echo "Using $COUNT scenes"

          echo "Concat filter:"
          echo "$FILTER"

          ffmpeg \
            -nostdin \
            -y \
            "${INPUT_ARGS[@]}" \
            -filter_complex "$FILTER" \
            -map "[v]" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -r 30 \
            -video_track_timescale 90000 \
            combined.mp4

          COMBINED_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            combined.mp4)

          echo "Combined video duration: $COMBINED_DURATION seconds"

      # ==================================================
      # ADD VOICE-OVER
      # ==================================================

      - name: Add voice-over
        run: |

          ffmpeg \
            -nostdin \
            -y \
            -i combined.mp4 \
            -f s16le \
            -ar 24000 \
            -ac 1 \
            -i voice.pcm \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            output.mp4

          FINAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output.mp4)

          echo
          echo "========================================"
          echo "FINAL VIDEO DURATION: $FINAL_DURATION seconds"
          echo "========================================"

          if awk "BEGIN {exit !($FINAL_DURATION < 15)}"; then
            echo "ERROR: Final video is shorter than 15 seconds."
            exit 1
          fi

      # ==================================================
      # SAVE FINAL VIDEO
      # ==================================================

      - name: Save video to repository
        run: |

          mkdir -p videos

          cp output.mp4 videos/latest.mp4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/latest.mp4

          git commit \
            -m "Update rendered video" \
            || echo "No changes to commit"

          git push
