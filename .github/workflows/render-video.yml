                    <rect x="625" y="850" width="120" height="220" rx="12" fill="#C5CDD6" />
                  </>}

                  {isLab && <>
                    <rect x="0" y="1160" width={W} height="760" fill="#C9D0D3" />
                    <rect x="75" y="310" width="930" height="520" rx="28" fill="#E9ECEA" />
                    <rect x="125" y="360" width="300" height="390" rx="20" fill="#CFE9EF" />
                    <rect x="490" y="470" width="410" height="70" rx="20" fill="#A8B3BC" />
                    <circle cx="560" cy="720" r="105" fill="#BFD5C8" opacity=".8" />
                  </>}

                  {isClass && <>
                    <rect x="0" y="1160" width={W} height="760" fill="#C9B99E" />
                    <rect x="80" y="250" width="920" height="520" rx="24" fill="#45505A" />
                    <rect x="115" y="285" width="850" height="450" fill="#58636D" />
                    <line x1="190" y1="440" x2="620" y2="440" stroke="#F3F0E7" strokeWidth="9" opacity=".7" />
                    <line x1="230" y1="570" x2="760" y2="570" stroke="#F3F0E7" strokeWidth="9" opacity=".6" />
                    <rect x="90" y="970" width="900" height="60" rx="18" fill="#8B6E52" />
                  </>}

                  {isKitchen && <>
                    <rect x="0" y="1170" width={W} height="750" fill="#D4D5CF" />
                    <rect x="70" y="620" width="940" height="560" rx="25" fill="#F0EEE8" />
                    <rect x="130" y="710" width="250" height="290" rx="20" fill="#B8C2C9" />
                    <rect x="630" y="700" width="280" height="290" rx="20" fill="#AEB8C0" />
                    <circle cx="755" cy="800" r="60" fill="#DCE6EA" />
                  </>}

                  {isGym && <>
                    <rect x="0" y="1160" width={W} height="760" fill="#303947" />
                    <rect x="80" y="270" width="920" height="560" rx="30" fill="#4C5867" />
                    <circle cx="190" cy="420" r="100" fill="#647181" />
                    <rect x="610" y="430" width="280" height="35" rx="18" fill="#202938" />
                    <circle cx="620" cy="450" r="40" fill="#202938" /><circle cx="880" cy="450" r="40" fill="#202938" />
                  </>}

                  {isCity && <>
                    <rect x="0" y="1130" width={W} height="790" fill="#707983" />
                    {[40,240,460,700,910].map((x,i)=>
                      <g key={i}>
                        <rect x={x} y={500-(i%3)*70} width="160" height={630+(i%3)*70} fill={i%2?"#9CA6AF":"#89949F"} />
                        {[0,1,2,3].map(j =>
                          <rect key={j} x={x+25} y={580+j*110-(i%2)*25} width="28" height="42" fill="#F7D979" opacity=".65" />
                        )}
                      </g>
                    )}
                    <rect x="0" y="1420" width={W} height="16" fill="#F6D76D" />
                  </>}

                  {isForest && <>
                    <rect x="0" y="1230" width={W} height="690" fill="#98C48E" />
                    {[70,260,480,720,930].map((x,i)=>
                      <g key={i}>
                        <rect x={x} y="570" width="34" height="700" fill="#76533D" />
                        <circle cx={x+17} cy="560" r={120+(i%2)*25} fill={i%2?"#70A86D":"#82B97A"} />
                      </g>
                    )}
                    {s.includes("mountain") && <path d="M0 1250 L240 850 L430 1120 L630 690 L1080 1260Z" fill="#71899A" opacity=".85" />}
                  </>}

                  {isOcean && <>
                    <rect x="0" y="1030" width={W} height="890" fill="#4D9DC1" />
                    <path d="M0 1100 Q135 1040 270 1100 T540 1100 T810 1100 T1080 1100 V1200 Q945 1140 810 1200 T540 1200 T270 1200 T0 1200Z" fill="#78BED5" />
                    <path d="M0 1300 Q160 1240 320 1300 T640 1300 T960 1300 T1080 1300" fill="none" stroke="#B5E4EE" strokeWidth="16" opacity=".6" />
                  </>}

                  {!isOffice && !isLab && !isClass && !isKitchen && !isGym && !isCity && !isForest && !isOcean && <>
                    <rect x="0" y="1210" width={W} height="710" fill="#D8D1C6" />
                    <path d="M0 1240 Q270 1130 540 1220 T1080 1190 V1920 H0Z" fill="#C9D8C9" />
                  </>}

                  <rect x="0" y="0" width={W} height={H} fill="none" stroke="rgba(255,255,255,.18)" strokeWidth="2" />
                </svg>
              </AbsoluteFill>
            );
          }

          function ActionFX({ beats, frame }) {
            for (const beat of beats || []) {
              const start = Number(beat.start ?? beat.time ?? 0) * FPS;
              const end = Number(beat.end ?? ((beat.time ?? 0)+1)) * FPS;
              if (frame < start || frame > end) continue;
              const p = clamp((frame-start)/Math.max(1,end-start));
              const a = String(beat.action || "").toLowerCase();
              if (!["discover","reveal","collide","celebrate","fall"].includes(a)) continue;

              const opacity = interpolate(p, [0,.15,.75,1], [0,.9,.35,0]);
              const r = interpolate(p, [0,1], [20,130]);

              return (
                <div style={{position:"absolute",left:"50%",top:"43%",transform:"translate(-50%,-50%)",opacity,zIndex:40,pointerEvents:"none"}}>
                  <svg width="400" height="400" viewBox="0 0 400 400">
                    <circle cx="200" cy="200" r={r} fill="none" stroke="#FFD75A" strokeWidth="11" />
                    {[0,45,90,135,180,225,270,315].map(deg=>{
                      const rad=deg*Math.PI/180;
                      return <line key={deg}
                        x1={200+Math.cos(rad)*(r+18)} y1={200+Math.sin(rad)*(r+18)}
                        x2={200+Math.cos(rad)*(r+65)} y2={200+Math.sin(rad)*(r+65)}
                        stroke="#FFFFFF" strokeWidth="8" strokeLinecap="round"/>;
                    })}
                  </svg>
                </div>
              );
            }
            return null;
          }

          function Camera({ type, children }) {
            // Professional locked camera. Shot changes happen by composition, not automatic motion.
            const c = String(type || "steady").toLowerCase();
            const scale =
              c.includes("extreme_close") ? 1.14 :
              c.includes("close") ? 1.08 :
              c.includes("medium") ? 1.03 :
              1;

            return <div style={{
              position:"absolute",
              inset:0,
              overflow:"hidden",
              transform:`scale(${scale})`,
              transformOrigin:"50% 50%"
            }}>{children}</div>;
          }

          function Captions({ captions, frame }) {
            if (!Array.isArray(captions) || !captions.length) return null;
            const time=frame/FPS;
            let idx=captions.findIndex(c=>time>=Number(c.start||0)&&time<=Number(c.end||0));
            if(idx<0) return null;

            const from=Math.max(0,idx-2);
            const to=Math.min(captions.length,idx+3);
            const visible=captions.slice(from,to);

            return <div style={{
              position:"absolute",left:55,right:55,bottom:78,zIndex:100,
              display:"flex",justifyContent:"center",pointerEvents:"none"
            }}>
              <div style={{
                maxWidth:940,padding:"17px 24px 19px",
                borderRadius:24,background:"rgba(8,14,25,.84)",
                color:"#fff",fontFamily:"Arial,Helvetica,sans-serif",
                fontSize:46,lineHeight:1.12,fontWeight:800,
                textAlign:"center",boxShadow:"0 12px 35px rgba(0,0,0,.24)"
              }}>
                {visible.map((w,i)=>{
                  const active=from+i===idx;
                  return <span key={i} style={{
                    marginRight:11,
                    color:active?"#FFD75A":"#FFFFFF",
                    textShadow:active?"0 2px 0 rgba(0,0,0,.25)":"none"
                  }}>{w.word}</span>;
                })}
              </div>
            </div>;
          }

          export function Video({ scenes=[], captions=[], theme={} }) {
            const frame=useCurrentFrame();

            let cursor=0;
            const timeline=scenes.map((scene,index)=>{
              const start=cursor;
              const duration=Number(scene.duration||5);
              cursor+=duration;
              return {scene,index,start,duration};
            });

            const current=timeline.find(x=>frame>=Math.round(x.start*FPS)&&frame<Math.round((x.start+x.duration)*FPS))
              || timeline[timeline.length-1];

            return <AbsoluteFill style={{background:theme?.background||"#EAF0F7"}}>
              {current && (
                <SceneRenderer
                  scene={current.scene}
                  sceneIndex={current.index}
                  sceneStart={current.start}
                  frame={frame}
                  theme={theme}
                />
              )}
              <Captions captions={captions} frame={frame}/>
              <Audio src={staticFile("voice.mp3")} volume={1}/>
            </AbsoluteFill>;
          }

          function SceneRenderer({ scene, sceneIndex, sceneStart, frame, theme }) {
            const localFrame=frame-Math.round(sceneStart*FPS);
            const localSeconds=localFrame/FPS;
            const duration=Number(scene.duration||5);
            const progress=clamp(localSeconds/duration);
            const beats=Array.isArray(scene.beats)?scene.beats:[];

            return <AbsoluteFill>
              <Camera type={scene.camera?.shot || scene.camera || "steady"}>
                <Environment setting={scene.setting} environment={scene.environment} sceneIndex={sceneIndex} theme={theme}/>
                {scene.objects?.map((o,i)=><Object key={o.id||i} object={o} beats={beats} frame={localFrame} index={i}/>)}
                {scene.characters?.map((c,i)=><Character key={c.id||i} character={c} beats={beats} frame={localFrame} index={i}/>)}
                <ActionFX beats={beats} frame={localFrame}/>
              </Camera>
            </AbsoluteFill>;
          }

          EOF

      - name: Save n8n storyboard
        env:
          SCRIPT: ${{ inputs.script }}
          SCENES_JSON: ${{ inputs.scenes }}
          TITLE: ${{ inputs.title }}
          THEME_JSON: ${{ inputs.theme }}
        run: |
          set -euo pipefail
          printf '%s' "$SCRIPT" > ai-video/script.txt
          printf '%s' "$SCENES_JSON" > ai-video/scenes.json
          printf '%s' "$TITLE" > ai-video/title.txt
          printf '%s' "$THEME_JSON" > ai-video/theme.json

      - name: Normalize and validate storyboard
        working-directory: ai-video
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          script = Path("script.txt").read_text(encoding="utf-8").strip()
          scenes = json.loads(Path("scenes.json").read_text(encoding="utf-8"))
          theme = json.loads(Path("theme.json").read_text(encoding="utf-8") or "{}")

          if not isinstance(scenes, list):
              raise SystemExit("Storyboard must be a JSON array.")

          if len(scenes) != 6:
              raise SystemExit(f"Expected exactly 6 scenes, got {len(scenes)}.")

          words = script.split()
          if not 90 <= len(words) <= 120:
              raise SystemExit(f"Script must contain 90–120 words, got {len(words)}.")

          normalized = []
          for si, scene in enumerate(scenes):
              if not isinstance(scene, dict):
                  raise SystemExit(f"Scene {si+1} is not an object.")

              duration = float(scene.get("duration", 5))
              if duration <= 0:
                  raise SystemExit(f"Scene {si+1} has invalid duration.")

              beats = scene.get("beats") or []
              beats2 = []
              for bi, beat in enumerate(beats):
                  if not isinstance(beat, dict):
                      continue
                  if "at" in beat:
                      t = float(beat.get("at", 0)) * duration
                  else:
                      t = float(beat.get("time", beat.get("start", 0)))
                  span = float(beat.get("span", 0.16))
                  beats2.append({
                      **beat,
                      "time": max(0, t),
                      "span": max(0.08, min(0.45, span)),
                  })

              beats2.sort(key=lambda b: b["time"])

              for bi, beat in enumerate(beats2):
                  start = min(float(beat["time"]), max(0, duration - 0.1))
                  if "span" in beat:
                      end = min(duration, start + float(beat["span"]) * duration)
                  elif bi + 1 < len(beats2):
                      end = min(float(beats2[bi+1]["time"]), duration)
                  else:
                      end = duration
                  if end <= start:
                      end = min(duration, start + 0.8)

                  beat["start"] = start
                  beat["end"] = end

              scene["duration"] = duration
              scene["beats"] = beats2
              scene["characters"] = scene.get("characters") or []
              scene["objects"] = scene.get("objects") or []
              scene["environment"] = scene.get("environment") or {}
              scene["setting"] = scene.get("setting") or scene["environment"].get("type") or "studio"
              scene["camera"] = scene.get("camera") or "wide"
              if isinstance(scene["camera"], dict):
                  scene["camera"] = scene["camera"].get("shot") or "wide"
              normalized.append(scene)

          total = sum(float(s["duration"]) for s in normalized)
          if total < 25 or total > 45:
              raise SystemExit(f"Total duration should be 25–45 seconds, got {total:.1f}s.")

          props = {
              "scenes": normalized,
              "captions": [],
              "title": Path("title.txt").read_text(encoding="utf-8").strip(),
              "theme": theme if isinstance(theme, dict) else {},
          }

          Path("props.json").write_text(
              json.dumps(props, ensure_ascii=False),
              encoding="utf-8"
          )

          print(f"Validated: 6 scenes, {len(words)} words, {total:.1f}s total.")
          PY

      - name: Install Remotion
        working-directory: ai-video
        run: |
          npm install --no-fund --no-audit

      - name: Ensure Remotion browser
        working-directory: ai-video
        run: |
          npx remotion browser ensure

      - name: Generate voice
        working-directory: ai-video
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          python -m venv .venv
          . .venv/bin/activate

          pip install --disable-pip-version-check --no-cache-dir edge-tts faster-whisper

          edge-tts \
            --voice en-US-JennyNeural \
            --rate "+3%" \
            --text "$SCRIPT" \
            --write-media public/voice.mp3

      - name: Generate word-level captions
        working-directory: ai-video
        run: |
          set -euo pipefail
          . .venv/bin/activate

          python - <<'PY'
          import json
          from faster_whisper import WhisperModel

          model = WhisperModel("base.en", device="cpu", compute_type="int8")

          segments, _ = model.transcribe(
              "public/voice.mp3",
              word_timestamps=True,
              vad_filter=True,
          )

          words = []
          for segment in segments:
              for word in segment.words or []:
                  text = (word.word or "").strip()
                  if not text:
                      continue
                  words.append({
                      "word": text,
                      "start": round(float(word.start), 3),
                      "end": round(float(word.end), 3),
                      "text": text,
                  })

          with open("captions.json", "w", encoding="utf-8") as f:
              json.dump(words, f, ensure_ascii=False)

          print(f"Generated {len(words)} caption words.")
          PY

      - name: Merge captions into props
        working-directory: ai-video
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          props = json.loads(Path("props.json").read_text(encoding="utf-8"))
          captions = json.loads(Path("captions.json").read_text(encoding="utf-8"))

          props["captions"] = captions

          Path("props.json").write_text(
              json.dumps(props, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

      - name: Render MP4
        working-directory: ai-video
        run: |
          set -euo pipefail

          npm run render

          test -s out/video.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            out/video.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ai-cartoon-video
          path: ai-video/out/video.mp4
          if-no-files-found: error
          retention-days: 7
