          }

          function FX({
            beats,
            localSeconds
          }) {
            const active = beats.find(
              b =>
                localSeconds >=
                  Number(
                    b.start || 0
                  ) &&
                localSeconds <=
                  Number(
                    b.end || 0
                  )
            );

            if (!active) return null;

            const a = norm(
              `${active.action || ""} ${active.event || ""}`
            );

            const p = clamp(
              (
                localSeconds -
                Number(
                  active.start || 0
                )
              ) /
                Math.max(
                  0.08,
                  Number(
                    active.end ||
                    active.start ||
                    1
                  ) -
                    Number(
                      active.start ||
                        0
                    )
                )
            );

            if (
              !(
                a.includes("impact") ||
                a.includes("reveal") ||
                a.includes("surprise") ||
                a.includes("collide") ||
                a.includes("celebrate")
              )
            ) {
              return null;
            }

            const r = lerp(
              10,
              160,
              E(p)
            );

            const op = interpolate(
              p,
              [0, 0.25, 1],
              [0, 0.9, 0]
            );

            return (
              <div
                style={{
                  position: "absolute",
                  left: "50%",
                  top: "45%",
                  transform:
                    "translate(-50%,-50%)",
                  opacity: op,
                  zIndex: 70
                }}
              >
                <svg
                  width="500"
                  height="500"
                >
                  <circle
                    cx="250"
                    cy="250"
                    r={r}
                    fill="none"
                    stroke="#FFD85A"
                    strokeWidth="12"
                  />

                  {Array.from({
                    length: 10
                  }).map((_, i) => {
                    const ang =
                      (i / 10) *
                      Math.PI *
                      2;

                    return (
                      <line
                        key={i}
                        x1="250"
                        y1="250"
                        x2={
                          250 +
                          Math.cos(
                            ang
                          ) *
                            (r + 50)
                        }
                        y2={
                          250 +
                          Math.sin(
                            ang
                          ) *
                            (r + 50)
                        }
                        stroke="#FFF"
                        strokeWidth="7"
                        strokeLinecap="round"
                      />
                    );
                  })}
                </svg>
              </div>
            );
          }

          function Camera({
            shot = "wide",
            movement = "steady",
            focus = {
              x: 50,
              y: 50
            },
            progress = 0,
            children
          }) {
            const s = norm(shot);
            const m = norm(movement);
            const p = clamp(progress);

            let scale = 1.02;
            let x = 0;
            let y = 0;
            let r = 0;

            if (
              s.includes(
                "extreme_close"
              )
            ) {
              scale = 1.62;
            } else if (
              s.includes("close")
            ) {
              scale = 1.32;
            } else if (
              s.includes("medium")
            ) {
              scale = 1.12;
            }

            if (m.includes("push")) {
              scale *= lerp(
                1,
                1.06,
                p
              );
            }

            if (m.includes("pull")) {
              scale *= lerp(
                1.06,
                1,
                p
              );
            }

            if (
              m.includes("pan_left")
            ) {
              x = lerp(
                70,
                -70,
                p
              );
            }

            if (
              m.includes("pan_right")
            ) {
              x = lerp(
                -70,
                70,
                p
              );
            }

            if (
              m.includes("tilt_up")
            ) {
              y = lerp(
                60,
                -60,
                p
              );
            }

            if (
              m.includes(
                "tilt_down"
              )
            ) {
              y = lerp(
                -60,
                60,
                p
              );
            }

            if (
              m.includes("whip_left")
            ) {
              x =
                Math.sin(
                  p * Math.PI
                ) *
                -240;

              r =
                Math.sin(
                  p * Math.PI
                ) *
                -2.3;

              scale = 1.06;
            }

            if (
              m.includes("whip_right")
            ) {
              x =
                Math.sin(
                  p * Math.PI
                ) *
                240;

              r =
                Math.sin(
                  p * Math.PI
                ) *
                2.3;

              scale = 1.06;
            }

            if (m.includes("shake")) {
              x =
                Math.sin(
                  p *
                    Math.PI *
                    20
                ) * 7;

              y =
                Math.cos(
                  p *
                    Math.PI *
                    17
                ) * 5;

              r =
                Math.sin(
                  p *
                    Math.PI *
                    12
                ) * 0.7;
            }

            if (m.includes("orbit")) {
              x =
                Math.sin(
                  p *
                    Math.PI *
                    2
                ) * 26;

              y =
                Math.cos(
                  p *
                    Math.PI *
                    2
                ) * 16;

              r =
                Math.sin(
                  p *
                    Math.PI *
                    2
                ) * 1.1;

              scale = 1.05;
            }

            const fx =
              (
                50 -
                Number(
                  focus.x || 50
                )
              ) *
              0.12;

            const fy =
              (
                50 -
                Number(
                  focus.y || 50
                )
              ) *
              0.12;

            return (
              <div
                style={{
                  position:
                    "absolute",
                  inset: -120,
                  transform:
                    `translate(${x + fx}px,${y + fy}px) ` +
                    `scale(${scale}) ` +
                    `rotate(${r}deg)`,
                  transformOrigin:
                    "50% 50%"
                }}
              >
                {children}
              </div>
            );
          }

          function Transition({
            type,
            localSeconds,
            duration
          }) {
            const t = clamp(
              localSeconds /
                duration
            );

            const tr = norm(
              type || "cut"
            );

            if (
              tr.includes("fade")
            ) {
              const op =
                localSeconds < 0.35
                  ? interpolate(
                      localSeconds,
                      [0, 0.35],
                      [1, 0]
                    )
                  : localSeconds >
                    duration - 0.35
                    ? interpolate(
                        localSeconds,
                        [
                          duration -
                            0.35,
                          duration
                        ],
                        [0, 1]
                      )
                    : 0;

              return (
                <AbsoluteFill
                  style={{
                    background:
                      "#000",
                    opacity: op,
                    zIndex: 100
                  }}
                />
              );
            }

            if (
              tr.includes("flash")
            ) {
              const op =
                interpolate(
                  Math.sin(
                    t * Math.PI
                  ),
                  [0, 1],
                  [0, 0.28]
                );

              return (
                <AbsoluteFill
                  style={{
                    background:
                      "#FFF",
                    opacity: op,
                    zIndex: 100
                  }}
                />
              );
            }

            if (
              tr.includes("whip")
            ) {
              const p =
                clamp(
                  localSeconds /
                    0.24
                );

              const w =
                interpolate(
                  p,
                  [0, 1],
                  [0, W * 1.4]
                );

              return (
                <AbsoluteFill
                  style={{
                    background:
                      `linear-gradient(90deg,transparent ${w - 220}px,rgba(255,255,255,.65) ${w}px,transparent ${w + 220}px)`,
                    zIndex: 100
                  }}
                />
              );
            }

            return null;
          }

          function Captions({
            captions,
            t
          }) {
            if (
              !captions?.length
            ) {
              return null;
            }

            const active =
              captions.filter(
                word =>
                  t >=
                    Number(
                      word.start || 0
                    ) &&
                  t <=
                    Number(
                      word.end || 0
                    )
              );

            if (!active.length) {
              return null;
            }

            const idx =
              captions.findIndex(
                word =>
                  word ===
                  active[0]
              );

            const line =
              captions.slice(
                Math.max(
                  0,
                  idx - 3
                ),
                Math.min(
                  captions.length,
                  idx + 8
                )
              );

            return (
              <div
                style={{
                  position: "absolute",
                  left: 58,
                  right: 58,
                  bottom: 76,
                  zIndex: 150,
                  display: "flex",
                  justifyContent:
                    "center"
                }}
              >
                <div
                  style={{
                    maxWidth: 950,
                    padding:
                      "18px 26px 20px",
                    borderRadius: 22,
                    background:
                      "rgba(5,10,18,.82)",
                    boxShadow:
                      "0 16px 42px rgba(0,0,0,.24)",
                    fontFamily:
                      "Arial,Helvetica,sans-serif",
                    fontSize: 48,
                    fontWeight: 850,
                    lineHeight: 1.08,
                    color: "white",
                    textAlign: "center",
                    backdropFilter:
                      "blur(6px)"
                  }}
                >
                  {line.map(
                    (word, i) => (
                      <span
                        key={i}
                        style={{
                          marginRight: 10,
                          color:
                            word ===
                            active[0]
                              ? "#FFD85A"
                              : "#FFF"
                        }}
                      >
                        {word.word}
                      </span>
                    )
                  )}
                </div>
              </div>
            );
          }

          function Scene({
            scene,
            sceneIndex,
            start,
            duration,
            t,
            theme
          }) {
            const local =
              t - start;

            const p =
              clamp(
                local /
                  duration
              );

            const beat =
              currentBeat(
                scene,
                local
              );

            const shot =
              beat?.shot ||
              scene.camera?.shot ||
              "wide";

            const movement =
              beat?.movement ||
              scene.camera?.movement ||
              "steady";

            const focus =
              beat?.focus ||
              scene.camera?.focus || {
                x: 50,
                y: 50
              };

            const beats =
              Array.isArray(
                scene.beats
              )
                ? scene.beats
                : [];

            return (
              <AbsoluteFill>

                <Camera
                  shot={shot}
                  movement={movement}
                  focus={focus}
                  progress={
                    beat
                      ? clamp(
                          (
                            local -
                            Number(
                              beat.start ||
                                0
                            )
                          ) /
                            Math.max(
                              0.08,
                              Number(
                                beat.end ||
                                  beat.start ||
                                  1
                              ) -
                                Number(
                                  beat.start ||
                                    0
                                )
                            )
                        )
                      : p
                  }
                >

                  <Environment
                    env={
                      scene.environment ||
                      {}
                    }
                    sceneIndex={
                      sceneIndex
                    }
                    theme={
                      theme || {}
                    }
                  />

                  {(scene.objects ||
                    []).map(
                    (object, i) => (
                      <Prop
                        key={
                          object.id ||
                          i
                        }
                        object={
                          object
                        }
                        beats={
                          beats
                        }
                        localSeconds={
                          local
                        }
                        index={i}
                      />
                    )
                  )}

                  {(scene.characters ||
                    []).map(
                    (
                      character,
                      i
                    ) => (
                      <Character
                        key={
                          character.id ||
                          i
                        }
                        character={
                          character
                        }
                        beats={
                          beats
                        }
                        localSeconds={
                          local
                        }
                        index={i}
                      />
                    )
                  )}

                  <FX
                    beats={
                      beats
                    }
                    localSeconds={
                      local
                    }
                  />

                  <Transition
                    type={
                      scene.transitionIn
                    }
                    localSeconds={
                      local
                    }
                    duration={
                      duration
                    }
                  />

                </Camera>

                <Grain />

              </AbsoluteFill>
            );
          }

          export function Video({
            scenes = [],
            captions = [],
            theme = {},
            duration = 30
          }) {
            const t =
              useSeconds();

            let cursor = 0;

            const positioned =
              scenes.map(
                (scene, i) => {
                  const d =
                    Number(
                      scene.duration ||
                        5
                    );

                  const item = {
                    scene,
                    index: i,
                    start: cursor,
                    duration: d
                  };

                  cursor += d;

                  return item;
                }
              );

            const current =
              positioned.find(
                item =>
                  t >= item.start &&
                  t <
                    item.start +
                      item.duration
              ) ||
              positioned[
                positioned.length - 1
              ];

            return (
              <AbsoluteFill
                style={{
                  background:
                    C.ink,
                  overflow:
                    "hidden"
                }}
              >

                {current ? (
                  <Scene
                    {...current}
                    t={t}
                    theme={theme}
                  />
                ) : null}

                <Captions
                  captions={
                    captions
                  }
                  t={t}
                />

                <Audio
                  src={staticFile(
                    "voice.mp3"
                  )}
                  volume={1}
                />

              </AbsoluteFill>
            );
          }
          EOF

      - name: Save inputs
        env:
          SCRIPT: ${{ inputs.script }}
          SCENES_JSON: ${{ inputs.scenes }}
          TITLE: ${{ inputs.title }}
          THEME_JSON: ${{ inputs.theme }}
        run: |
          set -euo pipefail

          printf '%s' "$SCRIPT" > ai-video/script.txt
