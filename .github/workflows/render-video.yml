          function Character({
            character = {},
            beats = [],
            localSeconds,
            index
          }) {
            const id = String(
              character.id ||
              `c${index + 1}`
            );

            const seed = hash(id);

            const x = Number(
              character.x ?? 50
            );

            const y = Number(
              character.y ?? 80
            );

            const skin =
              character.skin ||
              C.skin;

            const hair =
              character.hairColor ||
              C.hair;

            const clothes =
              character.clothesColor ||
              character.color ||
              C.blue;

            const eye =
              character.eyeColor ||
              C.ink;

            const emotion =
              norm(
                character.emotion ||
                "neutral"
              );

            const outfit =
              norm(
                character.outfit ||
                "casual"
              );

            const active = beats.filter(
              b =>
                localSeconds >=
                  Number(b.start || 0) &&
                localSeconds <=
                  Number(b.end || 0) &&
                String(
                  b.character ||
                  b.subject ||
                  ""
                ).toLowerCase() ===
                  id.toLowerCase()
            );

            const act =
              active[active.length - 1] ||
              null;

            const a = norm(
              act?.action ||
              "idle"
            );

            const p = act
              ? clamp(
                  (
                    localSeconds -
                    Number(act.start || 0)
                  ) /
                    Math.max(
                      0.08,
                      Number(
                        act.end ||
                        act.start ||
                        1
                      ) -
                        Number(
                          act.start || 0
                        )
                    )
                )
              : 0;

            const phase =
              localSeconds * 6 +
              (seed % 31);

            const idleY =
              Math.sin(phase) * 1.7;

            let tx = 0;
            let ty = idleY;
            let rot = 0;
            let sc = 1;
            let lean = 0;

            if (
              a.includes("walk") ||
              a.includes("run") ||
              a.includes("enter") ||
              a.includes("exit")
            ) {
              tx =
                Math.sin(
                  E(p) * Math.PI
                ) * 28;

              ty =
                -Math.abs(
                  Math.sin(
                    E(p) * Math.PI * 2
                  )
                ) * 16;

              rot =
                Math.sin(
                  phase * 1.4
                ) * 2.5;
            }

            if (a.includes("jump")) {
              ty =
                -Math.sin(
                  Math.PI * p
                ) * 115;

              sc =
                1 +
                Math.sin(
                  Math.PI * p
                ) *
                  0.05;
            }

            if (
              a.includes("react") ||
              a.includes("surprise") ||
              a.includes("shock")
            ) {
              sc =
                1 +
                Math.sin(
                  Math.PI * p
                ) *
                  0.06;

              rot =
                Math.sin(
                  Math.PI *
                    p *
                    2
                ) * 5;
            }

            if (a.includes("shake")) {
              tx =
                Math.sin(
                  p *
                    Math.PI *
                    12
                ) * 7;

              rot =
                Math.sin(
                  p *
                    Math.PI *
                    9
                ) * 2;
            }

            if (a.includes("turn")) {
              rot = lerp(
                0,
                Number(
                  act.turnDegrees ||
                    20
                ),
                E(p)
              );
            }

            if (a.includes("lean")) {
              lean = lerp(
                0,
                Number(
                  act.degrees ||
                    9
                ),
                E(p)
              );
            }

            const talking =
              a.includes("speak") ||
              a.includes("talk") ||
              a.includes("explain") ||
              a.includes("argue");

            const blink =
              (
                Math.sin(
                  localSeconds * 2.7 +
                    seed
                ) *
                  0.5 +
                0.5
              ) > 0.985
                ? 0.08
                : 1;

            const surprised =
              emotion.includes(
                "surprise"
              ) ||
              a.includes("surprise") ||
              a.includes("shock");

            const angry =
              emotion.includes(
                "angry"
              ) ||
              a.includes("angry");

            const happy =
              emotion.includes(
                "happy"
              ) ||
              a.includes("laugh") ||
              a.includes(
                "celebrate"
              );

            const mouthOpen =
              talking
                ? (
                    Math.sin(
                      localSeconds *
                        13 +
                        seed
                    ) > 0
                      ? 1
                      : 0.35
                  )
