name: Render AI Video — Cinematic Engine

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Full voice-over script"
        required: true
        type: string

      scenes:
        description: "JSON cinematic storyboard from n8n"
        required: true
        type: string

      title:
        description: "Video title"
        required: true
        type: string

      theme:
        description: "Visual and audio theme JSON"
        required: false
        default: "{}"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create self-contained Remotion project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ai-video

          mkdir -p \
            ai-video/src \
            ai-video/public \
            ai-video/out

          cat > ai-video/package.json <<'EOF'
          {
            "private": true,
            "scripts": {
              "render": "remotion render src/index.jsx Main out/video.mp4 --props=props.json"
            },
            "dependencies": {
              "@remotion/cli": "4.0.529",
              "remotion": "4.0.529",
              "react": "18.3.1",
              "react-dom": "18.3.1"
            }
          }
          EOF

          cat > ai-video/src/index.jsx <<'EOF'
          import React from "react";
          import { registerRoot, Composition } from "remotion";
          import { Video } from "./Video";

          const FPS = 30;

          const getDuration = (props) =>
            Math.max(
              1,
              Math.round((props?.duration || 30) * FPS)
            );

          const Root = () => (
            <Composition
              id="Main"
              component={Video}
              durationInFrames={900}
              fps={FPS}
              width={1080}
              height={1920}
              defaultProps={{
                scenes: [],
                captions: [],
                title: "",
                theme: {},
                duration: 30
              }}
              calculateMetadata={({ props }) => ({
                durationInFrames: getDuration(props),
                fps: FPS,
                width: 1080,
                height: 1920
              })}
            />
          );

          registerRoot(Root);
          EOF

          cat > ai-video/src/Video.jsx <<'EOF'
          import React from "react";

          import {
            AbsoluteFill,
            Audio,
            interpolate,
            staticFile,
            useCurrentFrame
          } from "remotion";

          const W = 1080;
          const H = 1920;
          const FPS = 30;

          const C = {
            ink: "#121722",
            white: "#F9FBFF",
            skin: "#E9A77D",
            hair: "#281B20",
            navy: "#18243A",
            blue: "#4568E8",
            cyan: "#57C6D8",
            violet: "#8669E8",
            yellow: "#FFD85A",
            orange: "#F28A55",
            red: "#E76165",
            green: "#62B687",
            grey: "#9AA5B4",
            light: "#E9EDF3",
            dark: "#263041"
          };

          const clamp = (v, a = 0, b = 1) =>
            Math.max(a, Math.min(b, v));

          const norm = (v = "") =>
            String(v)
              .toLowerCase()
              .replace(/[-\s]+/g, "_");

          const lerp = (a, b, t) =>
            a + (b - a) * t;

          const E = (t) =>
            t < 0.5
              ? 4 * t * t * t
              : 1 - Math.pow(-2 * t + 2, 3) / 2;

          const hash = (s = "") => {
            let h = 2166136261;

            for (let i = 0; i < s.length; i++) {
              h ^= s.charCodeAt(i);
              h = Math.imul(h, 16777619);
            }

            return Math.abs(h >>> 0);
          };

          function useSeconds() {
            return useCurrentFrame() / FPS;
          }

          function currentBeat(scene, localSeconds) {
            const beats = Array.isArray(scene?.beats)
              ? scene.beats
              : [];

            for (const beat of beats) {
              if (
                localSeconds >= Number(beat.start || 0) &&
                localSeconds <= Number(beat.end || 0)
              ) {
                return beat;
              }
            }

            return null;
          }

          function Light({
            x,
            y,
            r = 220,
            color = "#FFD66A",
            opacity = 0.18
          }) {
            return (
              <div
                style={{
                  position: "absolute",
                  left: `${x}%`,
                  top: `${y}%`,
                  width: r * 2,
                  height: r * 2,
                  borderRadius: "50%",
                  transform: "translate(-50%,-50%)",
                  background:
                    `radial-gradient(circle,${color} 0%,transparent 70%)`,
                  opacity,
                  filter: "blur(18px)",
                  pointerEvents: "none"
                }}
              />
            );
          }

          function Grain() {
            return (
              <AbsoluteFill
                style={{
                  pointerEvents: "none",
                  opacity: 0.055,
                  mixBlendMode: "overlay",
                  backgroundImage:
                    "repeating-linear-gradient(0deg,rgba(255,255,255,.24) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,transparent 1px 5px)"
                }}
              />
            );
          }

          function GridPerspective({
            color = "rgba(255,255,255,.08)"
          }) {
            return (
              <svg
                viewBox={`0 0 ${W} ${H}`}
                width="100%"
                height="100%"
                style={{
                  position: "absolute",
                  inset: 0,
                  pointerEvents: "none",
                  opacity: 0.65
                }}
              >
                {[0, 90, 180, 270, 360].map((x, i) => (
                  <line
                    key={i}
                    x1={540 + x - 180}
                    y1="1220"
                    x2={540 + x - 180}
                    y2="1920"
                    stroke={color}
                    strokeWidth="3"
                  />
                ))}

                {[0, 90, 180, 270, 360, 450, 540].map(
                  (y, i) => (
                    <line
                      key={i}
                      x1="0"
                      y1={1220 + i * 100}
                      x2={W}
                      y2={1220 + i * 100}
                      stroke={color}
                      strokeWidth="3"
                    />
                  )
                )}
              </svg>
            );
          }

          function Environment({
            env = {},
            sceneIndex = 0,
            theme = {}
          }) {
            const type = norm(
              env.type ||
              env.location ||
              "cinematic_room"
            );

            const night = norm(
              env.time || "day"
            ).includes("night");

            const mood = norm(
              env.mood || "cinematic"
            );

            const wall =
              night
                ? "#111A2D"
                : "#DDE6F0";

            const custom =
              Array.isArray(env.elements)
                ? env.elements
                : [];

            return (
              <AbsoluteFill
                style={{
                  background: wall,
                  overflow: "hidden"
                }}
              >
                <svg
                  width="100%"
                  height="100%"
                  viewBox={`0 0 ${W} ${H}`}
                  preserveAspectRatio="none"
                >
                  <defs>

                    <linearGradient
                      id={`sky${sceneIndex}`}
                      x1="0"
                      y1="0"
                      x2="0"
                      y2="1"
                    >
                      <stop
                        offset="0"
                        stopColor={
                          night
                            ? "#0E1528"
                            : "#DAEAF5"
                        }
                      />

                      <stop
                        offset="1"
                        stopColor={wall}
                      />
                    </linearGradient>

                    <linearGradient
                      id={`metal${sceneIndex}`}
                      x1="0"
                      y1="0"
                      x2="1"
                      y2="1"
                    >
                      <stop
                        offset="0"
                        stopColor="#596677"
                      />

                      <stop
                        offset=".45"
                        stopColor="#2A3442"
                      />

                      <stop
                        offset="1"
                        stopColor="#111722"
                      />
                    </linearGradient>

                    <radialGradient
                      id={`vignette${sceneIndex}`}
                    >
                      <stop
                        offset="55%"
                        stopColor="transparent"
                      />

                      <stop
                        offset="100%"
                        stopColor="#000"
                        stopOpacity=".42"
                      />
                    </radialGradient>

                  </defs>

                  <rect
                    width={W}
                    height={H}
                    fill={`url(#sky${sceneIndex})`}
                  />

                  {/* TUNNEL / SUBWAY */}

                  {(
                    type.includes("tunnel") ||
                    type.includes("subway") ||
                    type.includes("metro")
                  ) ? (
                    <>
                      <path
                        d="M70 1180 Q540 380 1010 1180 L1010 1920 L70 1920Z"
                        fill="#202733"
                      />

                      <path
                        d="M165 1180 Q540 520 915 1180 L915 1920 L165 1920Z"
                        fill="#111720"
                      />

                      <path
                        d="M270 1180 Q540 700 810 1180 L810 1920 L270 1920Z"
                        fill="#18202B"
                      />

                      <path
                        d="M540 690 L540 1920"
                        stroke="#394657"
                        strokeWidth="8"
                        opacity=".65"
                      />

                      {Array.from({
                        length: 8
                      }).map((_, i) => {
                        const y = 720 + i * 135;

                        return (
                          <g key={i}>
                            <rect
                              x={300 - i * 13}
                              y={y}
                              width={480 + i * 26}
                              height="24"
                              rx="12"
                              fill="#A9D8E8"
                              opacity={0.16 + 0.05 * i}
                            />

                            <rect
                              x={330 - i * 9}
                              y={y + 8}
                              width={420 + i * 18}
                              height="8"
                              fill="#F8D776"
                              opacity={0.75 - 0.04 * i}
                            />
                          </g>
                        );
                      })}

                      <path
                        d="M300 1510 L470 1510 M610 1510 L780 1510 M300 1680 L470 1680 M610 1680 L780 1680"
                        stroke="#7B8798"
                        strokeWidth="10"
                      />

                      <path
                        d="M325 1515 L325 1920 M755 1515 L755 1920"
                        stroke="#495567"
                        strokeWidth="12"
                      />
                    </>
                  ) : null}

                  {/* SERVER ROOM */}

                  {(
                    type.includes("server") ||
                    type.includes("data") ||
                    type.includes("cyber")
                  ) ? (
                    <>
                      <rect
                        x="0"
                        y="0"
                        width={W}
                        height="1920"
                        fill="#0B1120"
                      />

                      {[90, 310, 530, 750, 870].map(
                        (x, i) => (
                          <g key={i}>
                            <rect
                              x={x}
                              y="420"
                              width="170"
                              height="1010"
                              rx="18"
                              fill={`url(#metal${sceneIndex})`}
                              stroke="#6B788A"
                              strokeWidth="4"
                            />

                            <line
                              x1={x + 30}
                              y1="530"
                              x2={x + 140}
                              y2="530"
                              stroke="#64D4DF"
                              strokeWidth="8"
                              opacity=".6"
                            />

                            <line
                              x1={x + 30}
                              y1="610"
                              x2={x + 140}
                              y2="610"
                              stroke="#8669E8"
                              strokeWidth="8"
                              opacity=".6"
                            />

                            {Array.from({
                              length: 9
                            }).map((_, j) => (
                              <circle
                                key={j}
                                cx={x + 35 + j * 13}
                                cy="690"
                                r="4"
                                fill={
                                  j % 2
                                    ? "#62B687"
                                    : "#FFD85A"
                                }
                                opacity={
                                  0.4 + j * 0.05
                                }
                              />
                            ))}
                          </g>
                        )
                      )}

                      <GridPerspective
                        color="rgba(98,212,223,.09)"
                      />
                    </>
                  ) : null}

                  {/* OFFICE */}

                  {(
                    type.includes("office") ||
                    type.includes("boardroom") ||
                    type.includes("meeting")
                  ) ? (
                    <>
                      <rect
                        y="0"
                        width={W}
                        height="1250"
                        fill={
                          night
                            ? "#151D2D"
                            : "#DDE4EC"
                        }
                      />

                      <rect
                        y="1250"
                        width={W}
                        height="670"
                        fill="#8F7969"
                      />

                      <rect
                        x="90"
                        y="280"
                        width="900"
                        height="480"
                        rx="30"
                        fill="#A9CDE2"
                        stroke="#6D8192"
                        strokeWidth="12"
                      />

                      <rect
                        x="120"
                        y="315"
                        width="840"
                        height="410"
                        rx="14"
                        fill="#D9EFFA"
                      />

                      <rect
                        x="110"
                        y="1120"
                        width="860"
                        height="120"
                        rx="28"
                        fill="#7D6656"
                      />

                      <rect
                        x="150"
                        y="1070"
                        width="780"
                        height="80"
                        rx="22"
                        fill="#9B7D67"
                      />
                    </>
                  ) : null}

                  {/* LAB */}

                  {(
                    type.includes("lab") ||
                    type.includes("laboratory")
                  ) ? (
                    <>
                      <rect
                        y="0"
                        width={W}
                        height="1250"
                        fill="#E9EEF2"
                      />

                      <rect
                        y="1250"
                        width={W}
                        height="670"
                        fill="#A9B1B8"
                      />

                      {[110, 360, 610, 860].map(
                        (x, i) => (
                          <rect
                            key={i}
                            x={x}
                            y="300"
                            width="170"
                            height="700"
                            rx="22"
                            fill="#D7DEE4"
                            stroke="#8795A2"
                            strokeWidth="7"
                          />
                        )
                      )}

                      <rect
                        x="70"
                        y="1110"
                        width="940"
                        height="130"
                        rx="26"
                        fill="#596574"
                      />

                      <circle
                        cx="180"
                        cy="1160"
                        r="32"
                        fill="#64D4DF"
                        opacity=".75"
                      />

                      <circle
                        cx="270"
                        cy="1160"
                        r="32"
                        fill="#FFD85A"
                        opacity=".75"
                      />

                      <circle
                        cx="360"
                        cy="1160"
                        r="32"
                        fill="#8669E8"
                        opacity=".75"
                      />
                    </>
                  ) : null}

                  {/* CITY / STREET */}

                  {(
                    type.includes("street") ||
                    type.includes("city") ||
                    type.includes("rooftop")
                  ) ? (
                    <>
                      {[35, 180, 330, 500, 690, 835, 980].map(
                        (x, i) => (
                          <rect
                            key={i}
                            x={x}
                            y={480 - (i % 3) * 60}
                            width={120 + (i % 3) * 45}
                            height={
                              1440 + (i % 3) * 60
                            }
                            fill={
                              i % 2
                                ? "#6F7A88"
                                : "#525E6D"
                            }
                          />
                        )
                      )}

                      <rect
                        y="1370"
                        width={W}
                        height="550"
                        fill="#2C333D"
                      />

                      <line
                        x1="0"
                        y1="1640"
                        x2={W}
                        y2="1510"
                        stroke="#E5C867"
                        strokeWidth="18"
                        strokeDasharray="90 70"
                        opacity=".8"
                      />
                    </>
                  ) : null}

                  {/* FACTORY / WAREHOUSE */}

                  {(
                    type.includes("factory") ||
                    type.includes("warehouse") ||
                    type.includes("workshop")
                  ) ? (
                    <>
                      <rect
                        y="0"
                        width={W}
                        height={H}
                        fill="#8E969D"
                      />

                      <path
                        d="M0 1180 L1080 980 L1080 1920 L0 1920Z"
                        fill="#4B545D"
                      />

                      {[
                        0,
                        1,
                        2,
                        3
                      ].map(i => (
                        <path
                          key={i}
                          d={`M${i * 300} 0 L${540 + i * 140} 1180`}
                          stroke="#BEC7CE"
                          strokeWidth="26"
                          opacity=".25"
                        />
                      ))}

                      {Array.from({
                        length: 6
                      }).map((_, i) => (
                        <rect
                          key={i}
                          x={80 + i * 180}
                          y={430 + (i % 2) * 120}
                          width="110"
                          height="450"
                          rx="18"
                          fill="#36404B"
                          stroke="#AEB7C0"
                          strokeWidth="8"
                        />
                      ))}
                    </>
                  ) : null}

                  {/* SPACE */}

                  {(
                    type.includes("space") ||
                    type.includes("spaceship")
                  ) ? (
                    <>
                      <rect
                        width={W}
                        height={H}
                        fill="#080C18"
                      />

                      {Array.from({
                        length: 60
                      }).map((_, i) => (
                        <circle
                          key={i}
                          cx={(i * 173) % W}
                          cy={
                            ((i * 307) % 1200) +
                            60
                          }
                          r={i % 3 === 0 ? 3 : 2}
                          fill="#FFF"
                          opacity={
                            0.35 + (i % 5) * 0.1
                          }
                        />
                      ))}

                      <path
                        d="M0 1420 Q240 1260 540 1420 T1080 1360 V1920 H0Z"
                        fill="#1C2750"
                      />
                    </>
                  ) : null}

                  {/* FOREST */}

                  {(
                    type.includes("forest") ||
                    type.includes("woods")
                  ) ? (
                    <>
                      <rect
                        width={W}
                        height={H}
                        fill="#BDD3B2"
                      />

                      <rect
                        y="1320"
                        width={W}
                        height="600"
                        fill="#557D55"
                      />

                      {[70, 250, 440, 660, 850, 1010].map(
                        (x, i) => (
                          <g key={i}>
                            <rect
                              x={x}
                              y={500 + (i % 2) * 120}
                              width="42"
                              height="980"
                              fill="#634B3B"
                            />

                            <circle
                              cx={x + 20}
                              cy={
                                510 +
                                (i % 2) * 120
                              }
                              r={120 + (i % 3) * 25}
                              fill={
                                i % 2
                                  ? "#5E9D65"
                                  : "#77A96A"
                              }
                            />
                          </g>
                        )
                      )}
                    </>
                  ) : null}

                  {/* OCEAN */}

                  {(
                    type.includes("ocean") ||
                    type.includes("underwater")
                  ) ? (
                    <>
                      <rect
                        width={W}
                        height={H}
                        fill="#0E6B87"
                      />

                      <path
                        d="M0 700 Q180 630 360 700 T720 700 T1080 700"
                        fill="none"
                        stroke="#8FE0E5"
                        strokeWidth="24"
                        opacity=".25"
                      />

                      <path
                        d="M0 1120 Q180 1040 360 1120 T720 1120 T1080 1120"
                        fill="none"
                        stroke="#8FE0E5"
                        strokeWidth="18"
                        opacity=".22"
                      />

                      <rect
                        y="1550"
                        width={W}
                        height="370"
                        fill="#0D4A5E"
                      />
                    </>
                  ) : null}

                  {/* KITCHEN / RESTAURANT */}

                  {(
                    type.includes("kitchen") ||
                    type.includes("restaurant")
                  ) ? (
                    <>
                      <rect
                        width={W}
                        height="1220"
                        fill="#E9DED1"
                      />

                      <rect
                        y="1220"
                        width={W}
                        height="700"
                        fill="#8F7764"
                      />

                      <rect
                        x="70"
                        y="350"
                        width="940"
                        height="600"
                        rx="25"
                        fill="#F4F1EA"
                        stroke="#B5A998"
                        strokeWidth="10"
                      />

                      <rect
                        x="130"
                        y="1010"
                        width="820"
                        height="150"
                        rx="28"
                        fill="#6F5A4B"
                      />
                    </>
                  ) : null}

                  {/* CLASSROOM */}

                  {(
                    type.includes("classroom") ||
                    type.includes("lecture")
                  ) ? (
                    <>
                      <rect
                        width={W}
                        height="1250"
                        fill="#E4E6E8"
                      />

                      <rect
                        y="1250"
                        width={W}
                        height="670"
                        fill="#B69B7E"
                      />

                      <rect
                        x="90"
                        y="260"
                        width="900"
                        height="560"
                        rx="24"
                        fill="#4B5665"
                      />

                      <rect
                        x="125"
                        y="295"
                        width="830"
                        height="490"
                        fill="#596574"
                      />

                      <line
                        x1="190"
                        y1="470"
                        x2="600"
                        y2="470"
                        stroke="#F7F1DA"
                        strokeWidth="10"
                      />

                      <line
                        x1="220"
                        y1="610"
                        x2="760"
                        y2="610"
                        stroke="#F7F1DA"
                        strokeWidth="10"
                      />
                    </>
                  ) : null}

                  {/* GENERIC FALLBACK */}

                  {!(
                    type.includes("tunnel") ||
                    type.includes("subway") ||
                    type.includes("metro") ||
                    type.includes("server") ||
                    type.includes("data") ||
                    type.includes("cyber") ||
                    type.includes("office") ||
                    type.includes("boardroom") ||
                    type.includes("meeting") ||
                    type.includes("lab") ||
                    type.includes("laboratory") ||
                    type.includes("street") ||
                    type.includes("city") ||
                    type.includes("rooftop") ||
                    type.includes("factory") ||
                    type.includes("warehouse") ||
                    type.includes("workshop") ||
                    type.includes("space") ||
                    type.includes("spaceship") ||
                    type.includes("forest") ||
                    type.includes("woods") ||
                    type.includes("ocean") ||
                    type.includes("underwater") ||
                    type.includes("kitchen") ||
                    type.includes("restaurant") ||
                    type.includes("classroom") ||
                    type.includes("lecture")
                  ) ? (
                    <>
                      <rect
                        width={W}
                        height="1250"
                        fill="#DCE7F0"
                      />

                      <rect
                        y="1250"
                        width={W}
                        height="670"
                        fill="#9D8C7B"
                      />

                      <rect
                        x="70"
                        y="260"
                        width="940"
                        height="680"
                        rx="32"
                        fill="#E9EDF2"
                        stroke="#AFBBC8"
                        strokeWidth="10"
                      />

                      <rect
                        x="100"
                        y="1080"
                        width="880"
                        height="120"
                        rx="30"
                        fill="#705C50"
                      />
                    </>
                  ) : null}
                </svg>

                {custom
                  .slice(0, 18)
                  .map((element, i) => (
                    <Decor
                      key={i}
                      element={element}
                      index={i}
                    />
                  ))}

                <Light
                  x={Number(env.lightX || 80)}
                  y={Number(env.lightY || 14)}
                  r={Number(env.lightRadius || 340)}
                  color={
                    env.lightColor ||
                    (mood.includes("cold")
                      ? "#7CC7FF"
                      : "#FFD76A")
                  }
                  opacity={Number(
                    env.lightOpacity || 0.13
                  )}
                />

                <AbsoluteFill
                  style={{
                    background:
                      "radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,.42) 100%)"
                  }}
                />
              </AbsoluteFill>
            );
          }

          function Decor({
            element = {},
            index = 0
          }) {
            const type = norm(
              element.type ||
              element.kind ||
              "detail"
            );

            const x = Number(
              element.x ?? 50
            );

            const y = Number(
              element.y ?? 50
            );

            const s = Number(
              element.scale ?? 1
            );

            const color =
              element.color ||
              C.blue;

            return (
              <div
                style={{
                  position: "absolute",
                  left: `${x}%`,
                  top: `${y}%`,
                  transform:
                    `translate(-50%,-50%) scale(${s})`,
                  zIndex: Number(
                    element.depth || 10
