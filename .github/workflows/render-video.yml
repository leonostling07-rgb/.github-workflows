      - name: Validate storyboard
        working-directory: ai-video
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          script = Path(
              "script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          scenes = json.loads(
              Path(
                  "scenes.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          if (
              not isinstance(
                  scenes,
                  list
              )
              or len(scenes) != 6
          ):
              raise SystemExit(
                  "Expected exactly 6 scenes."
              )

          words = [
              x for x
              in script.split()
              if x.strip()
          ]

          if not 85 <= len(words) <= 135:
              raise SystemExit(
                  f"Script should be 85–135 words, got {len(words)}."
              )

          for i, scene in enumerate(
              scenes, 1
          ):

              if not scene.get(
                  "narration"
              ):
                  raise SystemExit(
                      f"Scene {i} is missing narration."
                  )

              if (
                  not scene.get(
                      "environment"
                  )
                  or not scene[
                      "environment"
                  ].get("type")
              ):
                  raise SystemExit(
                      f"Scene {i} needs environment.type."
                  )

              if (
                  not scene.get(
                      "characters"
                  )
                  and not scene.get(
                      "objects"
                  )
              ):
                  raise SystemExit(
                      f"Scene {i} needs at least one visual subject/object."
                  )

              if len(
                  scene.get(
                      "beats"
                  )
                  or []
              ) < 4:
                  raise SystemExit(
                      f"Scene {i} needs at least 4 beats."
                  )

          print(
              f"Storyboard OK: 6 scenes / {len(words)} script words"
          )
          PY

