      - name: Transcribe voice with word timing
        working-directory: ai-video
        run: |
          set -euo pipefail

          . .venv/bin/activate

          python - <<'PY'
          import json
          from faster_whisper import WhisperModel

          model = WhisperModel(
              "base",
              device="cpu",
              compute_type="int8"
          )

          segments, _ = model.transcribe(
              "public/voice.mp3",
              word_timestamps=True,
              vad_filter=True,
              beam_size=5
          )

          words = []

          for segment in segments:
              for word in segment.words or []:

                  text = (
                      word.word or ""
                  ).strip()

                  if not text:
                      continue

                  words.append(
                      {
                          "word": text,
                          "start": round(
                              float(
                                  word.start
                              ),
                              3
                          ),
                          "end": round(
                              float(
                                  word.end
                              ),
                              3
                          )
                      }
                  )

          with open(
              "captions.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  words,
                  f,
                  ensure_ascii=False
              )

          duration = (
              words[-1]["end"]
              if words
              else 30
          )

          with open(
              "audio-meta.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "duration":
                          duration
                  },
                  f
              )

          print(
              f"{len(words)} words / {duration:.2f}s"
          )
          PY

      - name: Align scenes and beats to real voice timing
        working-directory: ai-video
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re

          from pathlib import Path
          from difflib import SequenceMatcher

          def tokens(text):
              return re.findall(
                  r"[\wÅÄÖåäöÉéÜü']+",
                  str(text).lower()
              )

          scenes = json.loads(
              Path(
                  "scenes.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          captions = json.loads(
              Path(
                  "captions.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          audio = json.loads(
              Path(
                  "audio-meta.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          total = float(
              audio["duration"]
          )

          expected_script = []
          boundaries = []

          count = 0

          for scene in scenes:

              scene_words = tokens(
                  scene.get(
                      "narration",
                      ""
                  )
              )

              expected_script.extend(
                  scene_words
              )

              count += len(
                  scene_words
              )

              boundaries.append(
                  count
              )

          actual = []

          for caption in captions:
              words = tokens(
                  caption.get(
                      "word",
                      ""
                  )
              )

              if words:
                  actual.append(
                      words[0]
                  )

          matcher = SequenceMatcher(
              a=expected_script,
              b=actual,
              autojunk=False
          )

          mapping = []

          for tag, i1, i2, j1, j2 in matcher.get_opcodes():

              if tag == "equal":

                  for k in range(
                      i2 - i1
                  ):
                      mapping.append(
                          (
                              i1 + k,
                              j1 + k
                          )
                      )

              else:

                  span = max(
                      1,
                      i2 - i1
                  )

                  for k in range(
                      i2 - i1
                  ):

                      mapped = round(
                          j1 +
                          (
                              k /
                              span
                          ) *
                          max(
                              0,
                              j2 - j1 - 1
                          )
                      )

                      mapping.append(
                          (
                              i1 + k,
                              mapped
                          )
                      )

          mapping = dict(
              mapping
          )

          def boundary_to_actual(
              idx
          ):

              if not captions:
                  return 0

              if idx <= 0:
                  return 0

              next_positions = [
                  key
                  for key
                  in mapping.keys()
                  if key >= idx
              ]

              previous_positions = [
                  key
                  for key
                  in mapping.keys()
                  if key < idx
              ]

              if next_positions:

                  return int(
                      mapping[
                          min(
                              next_positions
                          )
                      ]
                  )

              if previous_positions:

                  return min(
                      len(
                          captions
                      ) - 1,
                      int(
                          mapping[
                              max(
                                  previous_positions
                              )
                          ]
                      )
                  )

              return min(
                  len(
                      captions
                  ) - 1,
                  round(
                      idx *
                      len(
                          captions
                      ) /
                      max(
                          1,
                          len(
                              expected_script
                          )
                      )
                  )
              )

          scene_bounds = [
              0
          ] + boundaries

          aligned = []

          for i, scene in enumerate(
              scenes
          ):

              start_idx = (
                  boundary_to_actual(
                      scene_bounds[i]
                  )
              )

              end_idx = (
                  boundary_to_actual(
                      scene_bounds[i + 1]
                  )
              )

              if (
                  i ==
                  len(scenes) - 1
              ):
                  end_idx = (
                      len(captions) - 1
                  )

              if captions:

                  start_t = float(
                      captions[
                          max(
                              0,
                              min(
                                  start_idx,
                                  len(
                                      captions
                                  ) - 1
                              )
                          )
                      ]["start"]
                  )

                  end_t = float(
                      captions[
                          max(
                              0,
                              min(
                                  end_idx,
                                  len(
                                      captions
                                  ) - 1
                              )
                          )
                      ]["end"]
                  )

              else:

                  start_t = 0
                  end_t = total

              if end_t <= start_t:
                  end_t = min(
                      total,
                      start_t +
                      max(
                          0.5,
                          total / 6
                      )
                  )

              duration = max(
                  0.4,
                  end_t - start_t
              )

              beats = []

              beat_count = max(
                  1,
                  len(
                      scene.get(
                          "beats"
                      )
                      or []
                  )
              )

              for j, beat in enumerate(
                  scene.get(
                      "beats"
                  )
                  or []
              ):

                  at = float(
                      beat.get(
                          "at",
                          beat.get(
                              "time",
                              j /
                              max(
                                  1,
                                  beat_count -
                                  1
                              )
                          )
                      )
                  )

                  at = max(
                      0,
                      min(
                          1,
                          at
                      )
                  )

                  span = float(
                      beat.get(
                          "span",
                          0.18
                      )
                  )

                  span = max(
                      0.08,
                      min(
                          0.45,
                          span
                      )
                  )

                  beat_start = (
                      at *
                      duration
                  )

                  beat_end = min(
                      duration,
                      beat_start +
                      span *
                      duration
                  )

                  beats.append(
                      {
                          **beat,
                          "start":
                              round(
                                  beat_start,
                                  3
                              ),
                          "end":
                              round(
                                  beat_end,
                                  3
                              )
                      }
                  )

              aligned.append(
                  {
                      **scene,
                      "duration":
                          round(
                              duration,
                              3
                          ),
                      "audioStart":
                          round(
                              start_t,
                              3
                          ),
                      "audioEnd":
                          round(
                              end_t,
                              3
                          ),
                      "beats":
                          beats
                  }
              )

          if aligned:

              used = sum(
                  item[
                      "duration"
                  ]
                  for item in
                  aligned[:-1]
              )

              aligned[
                  -1
              ][
                  "duration"
              ] = round(
                  max(
                      0.4,
                      total - used
                  ),
                  3
              )

          props = {
              "scenes":
                  aligned,

              "captions":
                  captions,

              "title":
                  Path(
                      "title.txt"
                  ).read_text(
                      encoding="utf-8"
                  ).strip(),

              "theme":
                  json.loads(
                      Path(
                          "theme.json"
                      ).read_text(
                          encoding="utf-8"
                      )
                      or "{}"
                  ),

              "duration":
                  total
          }

          Path(
              "props.json"
          ).write_text(
              json.dumps(
                  props,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              "Aligned scenes:",
              [
                  round(
                      s["duration"],
                      2
                  )
                  for s in
                  aligned
              ]
          )
          PY

      - name: Render MP4
        working-directory: ai-video
        run: |
          set -euo pipefail

          npm run render

          test -s out/video.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            out/video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ai-cartoon-video
          path: ai-video/out/video.mp4
          if-no-files-found: error
          retention-days: 7
