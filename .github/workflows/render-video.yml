                      })}
                      <path d="M300 1510 L470 1510 M610 1510 L780 1510 M300 1680 L470 1680 M610 1680 L780 1680" stroke="#7B8798" strokeWidth="10" />
                      <path d="M325 1515 L325 1920 M755 1515 L755 1920" stroke="#495567" strokeWidth="12" />
                    </>
                  ) : null}

                  {night ? (
                    <>
                      {[70,170,280,410,560,690,820,950].map((x,i)=>
                        <circle key={i} cx={x} cy={170+((i*91)%480)} r={i%2?4:6} fill="#fff" opacity=".62" />
