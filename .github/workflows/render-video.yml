name: render-video

on:
  workflow_dispatch:
    inputs:
      script:     { description: "Voiceover text", required: true, type: string }
      scenes:     { description: "Scenes JSON array", required: true, type: string }
      title:      { description: "Video title", required: true, type: string }
      theme:      { description: "Theme JSON", required: true, type: string }
      audio_path: { description: "Unused (voice is made here)", required: false, type: string, default: "" }

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: System libs for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg

      - name: Install python tools
        run: pip install faster-whisper edge-tts requests

      - name: Make voiceover (free, edge-tts)
        env:
          SCRIPT_TEXT: ${{ inputs.script }}
        run: |
          printf '%s' "$SCRIPT_TEXT" > script.txt
          edge-tts --voice en-US-AndrewNeural --file script.txt --write-media voice.mp3
          ffmpeg -y -i voice.mp3 -ar 24000 -ac 1 voice.wav

      - name: Prepare props (fetch visuals + whisper scene timing)
        env:
          IN_SCRIPT: ${{ inputs.script }}
          IN_SCENES: ${{ inputs.scenes }}
          IN_TITLE: ${{ inputs.title }}
          IN_THEME: ${{ inputs.theme }}
          IN_AUDIO: voice.wav
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/prepare.py

      - name: Install Remotion
        run: npm install --no-audit --no-fund

      - name: Render
        run: npx remotion render src/index.ts Short out/latest.mp4 --props=props.json --codec=h264 --concurrency=2

      - name: Commit result
        run: |
          mkdir -p videos
          cp out/latest.mp4 videos/latest.mp4
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add videos/latest.mp4
          git commit -m "Render video" || echo "nothing to commit"
          git pull --rebase || true
          git push

      - name: Notify n8n callback
        if: always()
        env:
          N8N_CALLBACK_URL: https://whatifworld.app.n8n.cloud/webhook/render-callback
          IN_TITLE: ${{ inputs.title }}
          IN_SCRIPT: ${{ inputs.script }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          status = "success" if os.environ.get("JOB_STATUS") == "success" else "failure"
          payload = json.dumps({
              "status": status,
              "title": os.environ.get("IN_TITLE", ""),
              "voiceover": os.environ.get("IN_SCRIPT", ""),
              "run_url": os.environ.get("RUN_URL", ""),
          }).encode()
          req = urllib.request.Request(
              os.environ["N8N_CALLBACK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("callback status", r.status)
          except Exception as e:
              print("callback failed:", e)
          PY
